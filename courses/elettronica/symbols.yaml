# Registro Globale dei Simboli — Elettronica (ING-INF/01)
# Imposto su tutti i 24 capitoli di src/content/docs/elettronica/.
# Qualsiasi simbolo indicato come vietato non va riutilizzato con significato conflittuale.

semiconduttori_e_diodi:
  q: "Carica elementare dell'elettrone (1.602e-19 C)"
  k: "Costante di Boltzmann (1.38e-23 J/K = 8.617e-5 eV/K)"
  V_T: "Tensione termica kT/q (~25.9 mV a 300 K). MAI usare V_T per la tensione di soglia del MOSFET."
  n_i: "Concentrazione intrinseca dei portatori nel silicio (~1.5e10 cm^-3 a 300 K)"
  N_A: "Concentrazione di atomi accettori (drogaggio di tipo P, cm^-3)"
  N_D: "Concentrazione di atomi donori (drogaggio di tipo N, cm^-3)"
  mu_n_mu_p: "Mobilità di deriva di elettroni (mu_n) e lacune (mu_p)"
  D_n_D_p: "Coefficienti di diffusione di elettroni e lacune (D/mu = V_T)"
  V_0: "Potenziale di contatto (built-in) della giunzione p-n (anche phi_j)"
  I_S: "Corrente di saturazione inversa nell'equazione di Shockley"
  eta: "Fattore di idealità (emissione) del diodo (1 <= eta <= 2)"
  r_d: "Resistenza differenziale di piccolo segnale del diodo: r_d = (eta * V_T) / I_D"
  C_j: "Capacità di giunzione (svuotamento) della giunzione p-n in inversa"
  C_d: "Capacità di diffusione del diodo in polarizzazione diretta (distinta da C_D di uscita)"
  V_Z: "Tensione nominale inversa di breakdown Zener"
  R_serie: "Resistore limitatore di serie nel regolatore Zener (evita collisione con R_S di Source)"

transistori_mos:
  V_th: "Tensione di soglia del MOSFET (V_th0 a V_SB = 0; anche V_TN per NMOS e V_TP per PMOS)"
  gamma: "Coefficiente di effetto body (soglia modulata da V_SB)"
  phi_F: "Potenziale di Fermi del substrato (2*phi_F nella formula della soglia)"
  k_n_prime: "Parametro di transconduttanza di processo mu_n * C_ox'' [A/V^2]"
  K_n: "Parametro di transconduttanza geometrico k_n' * (W/L) [A/V^2]"
  V_OV: "Tensione di overdrive V_GS - V_th (per NMOS in conduzione)"
  lambda: "Parametro di modulazione della lunghezza di canale [V^-1] (V_A = 1/lambda)"
  g_m: "Transconduttanza di gate di piccolo segnale"
  g_mb: "Transconduttanza di body (back-gate)"
  r_o: "Resistenza differenziale di uscita di piccolo segnale r_o = 1 / (lambda * I_D)"
  mu_f: "Fattore di amplificazione intrinseco del MOSFET: mu_f = g_m * r_o"
  C_ox_pp: "Capacità specifica dell'ossido di gate per unità di area C_ox'' = eps_ox / t_ox"
  C_gs_C_gd: "Capacità parassite intrinseche gate-source e gate-drain del MOSFET"
  C_sb_C_db: "Capacità di giunzione source-body e drain-body del MOSFET"
  f_T: "Frequenza di transizione a guadagno di corrente unitario del MOSFET: g_m / [2*pi*(C_gs + C_gd)]"
  forbidden_collisions:
    - "MAI usare V_T per la tensione di soglia del MOSFET: usare V_th, V_th0, V_TN o V_TP."

opamp_e_amplificatori:
  A_0: "Guadagno differenziale ad anello aperto in DC dell'Op-Amp (o A_vd)"
  GBW: "Prodotto guadagno-banda costante dell'Op-Amp (f_T dell'Op-Amp = A_0 * f_b)"
  SR: "Slew-Rate dell'Op-Amp: max |dv_out/dt| [V/us]"
  f_M: "Banda a piena potenza (full-power bandwidth): SR / (2*pi*V_p)"
  CMRR: "Common-Mode Rejection Ratio: 20*log10(|A_d / A_cm|)"
  V_OS: "Tensione di offset di ingresso dell'Op-Amp"
  I_B_I_OS: "Corrente di polarizzazione media I_B e corrente di offset I_OS dell'Op-Amp"
  R_sig: "Resistenza interna del generatore di segnale v_sig"
  R_S: "Resistore sul terminale di Source del MOSFET (polarizzazione e/o degenerazione)"
  R_D: "Resistore sul terminale di Drain del MOSFET"
  R_L: "Resistore di carico esterno accoppiato all'uscita"
  C_G_C_D_C_S: "Condensatori esterni di accoppiamento Gate (C_G), Drain (C_D) e bypass Source (C_S)"
  A_v: "Guadagno di tensione a centro banda dello stadio (v_out / v_in)"
  A_vs: "Guadagno di tensione complessivo dalla sorgente (v_out / v_sig)"
  f_L_f_H: "Frequenze di taglio inferiore (SCTC) e superiore (OCTC) a -3 dB"
  C_M: "Capacità equivalente di Miller all'ingresso: C_gd * (1 + |A_v|)"

digitale_cmos_e_memorie:
  V_DD: "Tensione di alimentazione positiva CMOS"
  V_M: "Soglia logica di commutazione della VTC (dove V_out = V_in = V_M)"
  V_OH_V_OL: "Livelli di uscita logici alto e basso"
  V_IH_V_IL: "Livelli di ingresso a pendenza unitaria (-1) sulla VTC"
  NM_H_NM_L: "Margini di rumore alto (V_OH - V_IH) e basso (V_IL - V_OL)"
  t_pHL_t_pLH: "Ritardi di propagazione alto-basso e basso-alto al 50%"
  t_p: "Ritardo di propagazione medio: (t_pHL + t_pLH) / 2"
  f_taper: "Fattore di scala geometrico costante nei buffer rastremati (f_opt = e)"
  C_S_C_BL: "Capacità di immagazzinamento della cella DRAM (C_S) e della bitline (C_BL)"
