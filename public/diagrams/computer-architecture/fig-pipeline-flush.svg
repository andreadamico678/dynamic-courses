<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="225" viewBox="0 0 660 225" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12">
  <rect width="660" height="225" fill="#fff"/>

  <!-- Stages -->
  <g stroke="#000" stroke-width="1.4" text-anchor="middle">
    <rect x="28" y="42" width="70" height="50" rx="3" fill="#e6ebff"/>
    <text x="63" y="64" stroke="none" font-weight="bold">IF</text>
    <text x="63" y="80" stroke="none" font-size="10.5">PC Mux</text>

    <rect x="130" y="42" width="16" height="84" fill="#d1d5db"/>
    <text x="138" y="142" stroke="none" font-size="10.5" font-weight="bold">IF/ID</text>

    <rect x="178" y="42" width="84" height="50" rx="3" fill="#e6ebff"/>
    <text x="220" y="64" stroke="none" font-weight="bold">ID</text>
    <text x="220" y="80" stroke="none" font-size="10.5">Control &amp; Zero?</text>

    <rect x="294" y="42" width="16" height="84" fill="#d1d5db"/>
    <text x="302" y="142" stroke="none" font-size="10.5" font-weight="bold">ID/EX</text>

    <rect x="344" y="42" width="86" height="50" rx="3" fill="#fef3c7"/>
    <text x="387" y="64" stroke="none" font-weight="bold">EX</text>
    <text x="387" y="80" stroke="none" font-size="10.5">Branch Resolves</text>

    <rect x="464" y="42" width="16" height="84" fill="#d1d5db"/>
    <text x="472" y="142" stroke="none" font-size="10.5" font-weight="bold">EX/MEM</text>

    <rect x="514" y="42" width="110" height="50" rx="3" fill="#dcfce7"/>
    <text x="569" y="64" stroke="none" font-weight="bold">Branch Unit</text>
    <text x="569" y="80" stroke="none" font-size="10.5">Taken = 1</text>
  </g>

  <!-- Main pipeline flow -->
  <g stroke="#111" stroke-width="1.4" fill="none">
    <line x1="98" y1="67" x2="126" y2="67"/><polygon points="124,63 130,67 124,71" fill="#111"/>
    <line x1="146" y1="67" x2="174" y2="67"/><polygon points="172,63 178,67 172,71" fill="#111"/>
    <line x1="262" y1="67" x2="290" y2="67"/><polygon points="288,63 294,67 288,71" fill="#111"/>
    <line x1="310" y1="67" x2="340" y2="67"/><polygon points="338,63 344,67 338,71" fill="#111"/>
    <line x1="430" y1="67" x2="460" y2="67"/><polygon points="458,63 464,67 458,71" fill="#111"/>
    <line x1="480" y1="67" x2="510" y2="67"/><polygon points="508,63 514,67 508,71" fill="#111"/>
  </g>

  <!-- Red Flush Control Lines -->
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <path d="M 569,92 L 569,176 L 63,176 L 63,97"/>
    <polygon points="59,100 63,92 67,100" fill="#dc2626"/>

    <line x1="138" y1="176" x2="138" y2="152"/>
    <polygon points="134,155 138,147 142,155" fill="#dc2626"/>

    <line x1="302" y1="176" x2="302" y2="152"/>
    <polygon points="298,155 302,147 306,155" fill="#dc2626"/>
  </g>

  <g font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">
    <text x="63" y="194">PCSrc = 1 (Target)</text>
    <text x="148" y="164" text-anchor="start" fill="#b91c1c">IF.Flush</text>
    <text x="312" y="164" text-anchor="start" fill="#b91c1c">ID.Flush</text>
    <text x="415" y="194">Zeros RegWrite &amp; MemWrite -&gt; turns wrong-path ops into NOPs</text>
  </g>
</svg>
