<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="325" viewBox="0 0 720 325" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12.5">
  <rect width="720" height="325" fill="#fff"/>

  <!-- TOP SECTION: 32-bit Integer Array (int *gain, stride = 4 bytes) -->
  <text x="24" y="24" font-size="13.5" font-weight="bold" fill="#1e3a8a">1. 32-Bit Integer Array: int *gain</text>
  <text x="248" y="24" font-family="monospace" font-size="11" fill="#444">(a1 = 0x10010100, stride = 4 bytes)</text>

  <!-- Word Addresses Above Cells -->
  <g font-family="monospace" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="115" y="45">0x10010100 (+0)</text>
    <text x="255" y="45" font-weight="bold" fill="#1e3a8a">0x10010104 (+4)</text>
    <text x="395" y="45">0x10010108 (+8)</text>
  </g>

  <!-- 3 Word Cells (140px each) -->
  <g stroke="#111" stroke-width="1.4" text-anchor="middle">
    <rect x="45"  y="52" width="140" height="44" fill="#e6ebff"/>
    <text x="115" y="72" stroke="none" font-family="monospace" font-size="12" font-weight="bold" fill="#111">gain[0] = 10</text>
    <text x="115" y="88" stroke="none" font-size="10.5" fill="#444">4 bytes (32 bits)</text>

    <rect x="185" y="52" width="140" height="44" fill="#d8dcff" stroke="#1f3fbf" stroke-width="2.2"/>
    <text x="255" y="72" stroke="none" font-family="monospace" font-size="12" font-weight="bold" fill="#1e3a8a">gain[1] = 3</text>
    <text x="255" y="88" stroke="none" font-size="10.5" font-weight="bold" fill="#1e3a8a">idx = 1 (selected)</text>

    <rect x="325" y="52" width="140" height="44" fill="#e6ebff"/>
    <text x="395" y="72" stroke="none" font-family="monospace" font-size="12" font-weight="bold" fill="#111">gain[2] = 15</text>
    <text x="395" y="88" stroke="none" font-size="10.5" fill="#444">4 bytes (32 bits)</text>
  </g>

  <!-- +4 Byte Stride Arcs -->
  <g fill="none" stroke="#1f3fbf" stroke-width="1.6">
    <path d="M 115,96 Q 185,122 250,100"/>
    <polygon points="246,97 254,97 250,104" fill="#1f3fbf" stroke="none"/>
    <path d="M 255,96 Q 325,122 390,100"/>
    <polygon points="386,97 394,97 390,104" fill="#1f3fbf" stroke="none"/>
  </g>
  <text x="185" y="125" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#1f3fbf">+4 B (slli by 2)</text>
  <text x="325" y="125" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#1f3fbf">+4 B</text>

  <!-- Word Access Code Box -->
  <rect x="492" y="38" width="212" height="90" rx="6" fill="#f7f7f9" stroke="#1f3fbf" stroke-width="1.4"/>
  <text x="504" y="56" font-size="11.5" font-weight="bold" fill="#1e3a8a">Word Stride Idiom (x4):</text>
  <g font-family="monospace" font-size="10.5" fill="#111">
    <text x="504" y="75">slli t4, a2, 2   # idx*4</text>
    <text x="504" y="93">add  t4, a1, t4  # &amp;gain[i]</text>
    <text x="504" y="111">lw   t4, 0(t4)   # 32-bit</text>
  </g>

  <!-- Horizontal Section Divider -->
  <line x1="20" y1="148" x2="700" y2="148" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5,4"/>

  <!-- BOTTOM SECTION: Null-Terminated ASCII String (char *pkt, stride = 1 byte) -->
  <text x="24" y="172" font-size="13.5" font-weight="bold" fill="#166534">2. Null-Terminated String: char *pkt</text>
  <text x="268" y="172" font-family="monospace" font-size="11" fill="#444">(a0 = 0x10010000, stride = 1 byte)</text>

  <!-- Byte Addresses Above Cells -->
  <g font-family="monospace" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="97.5"  y="194">..0000 (+0)</text>
    <text x="202.5" y="194">..0001 (+1)</text>
    <text x="307.5" y="194">..0002 (+2)</text>
    <text x="412.5" y="194" font-weight="bold" fill="#a61c3c">..0003 (+3)</text>
  </g>

  <!-- 4 Byte Cells (105px each) -->
  <g stroke="#111" stroke-width="1.4" text-anchor="middle">
    <rect x="45"  y="201" width="105" height="44" fill="#d8f5d8"/>
    <text x="97.5" y="220" stroke="none" font-family="monospace" font-size="12" font-weight="bold" fill="#111">'4' (0x34)</text>
    <text x="97.5" y="236" stroke="none" font-size="10.5" fill="#444">pkt[0], 1 B</text>

    <rect x="150" y="201" width="105" height="44" fill="#d8f5d8"/>
    <text x="202.5" y="220" stroke="none" font-family="monospace" font-size="12" font-weight="bold" fill="#111">'0' (0x30)</text>
    <text x="202.5" y="236" stroke="none" font-size="10.5" fill="#444">pkt[1], 1 B</text>

    <rect x="255" y="201" width="105" height="44" fill="#d8f5d8"/>
    <text x="307.5" y="220" stroke="none" font-family="monospace" font-size="12" font-weight="bold" fill="#111">'7' (0x37)</text>
    <text x="307.5" y="236" stroke="none" font-size="10.5" fill="#444">pkt[2], 1 B</text>

    <rect x="360" y="201" width="105" height="44" fill="#f9d8dc" stroke="#a61c3c" stroke-width="2.2"/>
    <text x="412.5" y="220" stroke="none" font-family="monospace" font-size="12" font-weight="bold" fill="#7f1d1d">'\0' (0x00)</text>
    <text x="412.5" y="236" stroke="none" font-size="10.5" font-weight="bold" fill="#7f1d1d">Sentinel</text>
  </g>

  <!-- +1 Byte Stride Arcs -->
  <g fill="none" stroke="#1e7e34" stroke-width="1.6">
    <path d="M 97.5,245 Q 150,270 198,249"/>
    <polygon points="194,246 202,246 198,253" fill="#1e7e34" stroke="none"/>
    <path d="M 202.5,245 Q 255,270 303,249"/>
    <polygon points="299,246 307,246 303,253" fill="#1e7e34" stroke="none"/>
    <path d="M 307.5,245 Q 360,270 408,249"/>
    <polygon points="404,246 412,246 408,253" fill="#1e7e34" stroke="none"/>
  </g>
  <text x="150" y="274" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#1e7e34">+1 B</text>
  <text x="255" y="274" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#1e7e34">+1 B</text>
  <text x="360" y="274" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#1e7e34">+1 B</text>
  <text x="412.5" y="290" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a61c3c">beqz exits loop</text>

  <!-- Byte Access Code Box -->
  <rect x="492" y="188" width="212" height="90" rx="6" fill="#f7f7f9" stroke="#1e7e34" stroke-width="1.4"/>
  <text x="504" y="206" font-size="11.5" font-weight="bold" fill="#166534">Byte Stride Idiom (x1):</text>
  <g font-family="monospace" font-size="10.5" fill="#111">
    <text x="504" y="225">add  t2, a0, t1  # &amp;pkt[i]</text>
    <text x="504" y="243">lbu  t3, 0(t2)   # 8-bit u</text>
    <text x="504" y="261">beqz t3, pkt_done</text>
  </g>

  <!-- Footer -->
  <text x="360" y="314" text-anchor="middle" font-size="11.5" fill="#444">Addr(Base, i) = Base + i * sizeof(T): multiply int* indices by 4 (slli by 2), step char* strings by 1 byte.</text>
</svg>
