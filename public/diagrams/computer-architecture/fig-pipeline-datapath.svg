<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12">
  <rect width="760" height="220" fill="#fff"/>

  <!-- Stage Headers -->
  <g text-anchor="middle" font-weight="bold" font-size="13" fill="#1e3a8a">
    <text x="72" y="24">IF</text>
    <text x="218" y="24">ID</text>
    <text x="372" y="24">EX</text>
    <text x="526" y="24">MEM</text>
    <text x="676" y="24">WB</text>
  </g>

  <!-- Stage Functional Blocks -->
  <g stroke="#000" stroke-width="1.4" text-anchor="middle">
    <!-- IF -->
    <rect x="24" y="42" width="32" height="54" rx="3" fill="#f3f4f6"/>
    <text x="40" y="73" stroke="none" font-weight="bold">PC</text>
    <rect x="66" y="42" width="54" height="54" rx="3" fill="#e6ebff"/>
    <text x="93" y="65" stroke="none" font-weight="bold">Instr.</text>
    <text x="93" y="81" stroke="none" font-weight="bold">Mem</text>

    <!-- ID -->
    <rect x="172" y="42" width="74" height="58" rx="3" fill="#e6ebff"/>
    <text x="209" y="66" stroke="none" font-weight="bold">Register</text>
    <text x="209" y="83" stroke="none" font-weight="bold">File</text>
    <rect x="172" y="112" width="74" height="28" rx="3" fill="#fef3c7"/>
    <text x="209" y="130" stroke="none" font-size="11" font-weight="bold">Control / Imm</text>

    <!-- EX -->
    <polygon points="340,44 396,56 396,94 340,106" fill="#e6ebff" stroke="#000" stroke-width="1.4"/>
    <text x="368" y="79" stroke="none" font-weight="bold">ALU</text>
    <rect x="336" y="114" width="68" height="26" rx="3" fill="#f3f4f6"/>
    <text x="370" y="131" stroke="none" font-size="11" font-weight="bold">PC + Imm</text>

    <!-- MEM -->
    <rect x="486" y="42" width="76" height="62" rx="3" fill="#ffe6cc"/>
    <text x="524" y="69" stroke="none" font-weight="bold">Data</text>
    <text x="524" y="85" stroke="none" font-weight="bold">Memory</text>

    <!-- WB -->
    <polygon points="650,48 684,56 684,96 650,104" fill="#d8f5d8" stroke="#000" stroke-width="1.4"/>
    <text x="667" y="80" stroke="none" font-size="11" font-weight="bold">Mux</text>
  </g>

  <!-- Interstage Pipeline Registers -->
  <g fill="#d1d5db" stroke="#000" stroke-width="1.5">
    <rect x="136" y="34" width="16" height="118"/>
    <rect x="284" y="34" width="16" height="118"/>
    <rect x="438" y="34" width="16" height="118"/>
    <rect x="594" y="34" width="16" height="118"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">
    <text x="144" y="168">IF/ID</text>
    <text x="292" y="168">ID/EX</text>
    <text x="446" y="168">EX/MEM</text>
    <text x="602" y="168">MEM/WB</text>
  </g>

  <!-- Forward Connections -->
  <g stroke="#111" stroke-width="1.4" fill="none">
    <line x1="56" y1="69" x2="66" y2="69"/>
    <line x1="120" y1="69" x2="136" y2="69"/>
    <line x1="152" y1="69" x2="172" y2="69"/>
    <line x1="152" y1="126" x2="172" y2="126"/>
    <line x1="246" y1="68" x2="284" y2="68"/>
    <line x1="246" y1="126" x2="284" y2="126"/>
    <line x1="300" y1="66" x2="340" y2="66"/>
    <line x1="300" y1="90" x2="340" y2="90"/>
    <line x1="300" y1="127" x2="336" y2="127"/>
    <line x1="396" y1="75" x2="438" y2="75"/>
    <line x1="404" y1="127" x2="438" y2="127"/>
    <line x1="454" y1="72" x2="486" y2="72"/>
    <line x1="562" y1="72" x2="594" y2="72"/>
    <path d="M 454,116 L 578,116 L 578,94 L 594,94"/>
    <line x1="610" y1="68" x2="650" y2="68"/>
    <line x1="610" y1="92" x2="650" y2="92"/>
  </g>

  <!-- WB Return Path (Dashed) -->
  <path d="M 684,76 L 724,76 L 724,190 L 209,190 L 209,105" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="205,107 209,100 213,107" fill="#15803d"/>
  <text x="466" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Write-Back path: Reg[rd] written in stage WB (returns to Register File)</text>
</svg>
