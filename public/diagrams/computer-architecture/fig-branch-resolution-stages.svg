<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="260" viewBox="0 0 660 260" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12">
  <rect width="660" height="260" fill="#fff"/>

  <!-- Cycle Headers -->
  <g text-anchor="middle" font-weight="bold" fill="#444" font-size="11.5">
    <text x="155" y="20">C1</text>
    <text x="215" y="20">C2</text>
    <text x="275" y="20">C3</text>
    <text x="335" y="20">C4</text>
    <text x="395" y="20">C5</text>
    <text x="455" y="20">C6</text>
  </g>

  <!-- Case 1: Resolve in ID (1 flush) -->
  <text x="16" y="54" font-weight="bold" fill="#1e3a8a">ID Resolution</text>
  <text x="16" y="69" font-size="10.5" fill="#15803d">(1 flush cycle)</text>
  <g stroke="#000" stroke-width="1.2" text-anchor="middle" font-weight="bold">
    <rect x="130" y="34" width="50" height="26" rx="3" fill="#dbeafe"/><text x="155" y="51" stroke="none">IF</text>
    <rect x="190" y="34" width="50" height="26" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/><text x="215" y="51" stroke="none">ID*</text>
    <rect x="250" y="34" width="50" height="26" rx="3" fill="#dbeafe"/><text x="275" y="51" stroke="none">EX</text>
    <rect x="310" y="34" width="50" height="26" rx="3" fill="#dbeafe"/><text x="335" y="51" stroke="none">MEM</text>
    <rect x="370" y="34" width="50" height="26" rx="3" fill="#dbeafe"/><text x="395" y="51" stroke="none">WB</text>

    <rect x="190" y="66" width="50" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="3,2"/><text x="215" y="82" stroke="none" fill="#b91c1c" font-size="10.5">FLUSH</text>
    <rect x="250" y="66" width="50" height="24" rx="3" fill="#dcfce7" stroke="#15803d"/><text x="275" y="82" stroke="none" fill="#166534" font-size="10.5">Target</text>
  </g>

  <!-- Case 2: Resolve in EX (2 flushes) -->
  <text x="16" y="132" font-weight="bold" fill="#1e3a8a">EX Resolution</text>
  <text x="16" y="147" font-size="10.5" fill="#b45309">(2 flush cycles)</text>
  <g stroke="#000" stroke-width="1.2" text-anchor="middle" font-weight="bold">
    <rect x="130" y="112" width="50" height="26" rx="3" fill="#dbeafe"/><text x="155" y="129" stroke="none">IF</text>
    <rect x="190" y="112" width="50" height="26" rx="3" fill="#dbeafe"/><text x="215" y="129" stroke="none">ID</text>
    <rect x="250" y="112" width="50" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="275" y="129" stroke="none">EX*</text>
    <rect x="310" y="112" width="50" height="26" rx="3" fill="#dbeafe"/><text x="335" y="129" stroke="none">MEM</text>
    <rect x="370" y="112" width="50" height="26" rx="3" fill="#dbeafe"/><text x="395" y="129" stroke="none">WB</text>

    <rect x="190" y="144" width="50" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="3,2"/><text x="215" y="160" stroke="none" fill="#b91c1c" font-size="10.5">FLUSH 1</text>
    <rect x="250" y="144" width="50" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="3,2"/><text x="275" y="160" stroke="none" fill="#b91c1c" font-size="10.5">FLUSH 2</text>
    <rect x="310" y="144" width="50" height="24" rx="3" fill="#dcfce7" stroke="#15803d"/><text x="335" y="160" stroke="none" fill="#166534" font-size="10.5">Target</text>
  </g>

  <!-- Case 3: Resolve in MEM (3 flushes) -->
  <text x="16" y="210" font-weight="bold" fill="#1e3a8a">MEM Resolution</text>
  <text x="16" y="225" font-size="10.5" fill="#b91c1c">(3 flush cycles)</text>
  <g stroke="#000" stroke-width="1.2" text-anchor="middle" font-weight="bold">
    <rect x="130" y="190" width="50" height="26" rx="3" fill="#dbeafe"/><text x="155" y="207" stroke="none">IF</text>
    <rect x="190" y="190" width="50" height="26" rx="3" fill="#dbeafe"/><text x="215" y="207" stroke="none">ID</text>
    <rect x="250" y="190" width="50" height="26" rx="3" fill="#dbeafe"/><text x="275" y="207" stroke="none">EX</text>
    <rect x="310" y="190" width="50" height="26" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="335" y="207" stroke="none">MEM*</text>
    <rect x="370" y="190" width="50" height="26" rx="3" fill="#dbeafe"/><text x="395" y="207" stroke="none">WB</text>

    <rect x="190" y="222" width="50" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="3,2"/><text x="215" y="238" stroke="none" fill="#b91c1c" font-size="10.5">FLUSH 1</text>
    <rect x="250" y="222" width="50" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="3,2"/><text x="275" y="238" stroke="none" fill="#b91c1c" font-size="10.5">FLUSH 2</text>
    <rect x="310" y="222" width="50" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="3,2"/><text x="335" y="238" stroke="none" fill="#b91c1c" font-size="10.5">FLUSH 3</text>
    <rect x="370" y="222" width="50" height="24" rx="3" fill="#dcfce7" stroke="#15803d"/><text x="395" y="238" stroke="none" fill="#166534" font-size="10.5">Target</text>
  </g>

  <text x="545" y="135" text-anchor="middle" font-size="11.5" fill="#444">Penalty = s - 1 cycles</text>
  <text x="545" y="154" text-anchor="middle" font-size="11" fill="#666">(ID: 1, EX: 2, MEM: 3)</text>
</svg>
