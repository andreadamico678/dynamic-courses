<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="13">
  <rect width="760" height="320" fill="#fff"/>

  <text x="380" y="23" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111">Two-Level Memory Hierarchy Latency Ladder (L1 + L2 + DRAM)</text>

  <!-- CPU Core -->
  <rect x="20" y="42" width="108" height="68" rx="6" fill="#d8dcff" stroke="#1f3fbf" stroke-width="1.6"/>
  <text x="74" y="67" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">CPU Core</text>
  <text x="74" y="85" text-anchor="middle" font-size="11.5" fill="#333">Memory Ref</text>
  <text x="74" y="101" text-anchor="middle" font-size="10.5" fill="#555">(100% accesses)</text>

  <!-- CPU -> L1 -->
  <line x1="128" y1="76" x2="164" y2="76" stroke="#333" stroke-width="1.8"/>
  <polygon points="162,72 170,76 162,80" fill="#333"/>

  <!-- L1 Cache -->
  <rect x="170" y="38" width="150" height="76" rx="6" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.6"/>
  <text x="245" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">L1 Cache (SRAM)</text>
  <text x="245" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#145a25"><tspan font-style="italic">t</tspan><tspan dy="2" font-size="9.5">hit,L1</tspan><tspan dy="-2"> ≈ 1 ns</tspan></text>
  <text x="245" y="99" text-anchor="middle" font-size="11" fill="#444">Miss Rate: MR<tspan dy="2" font-size="9">L1</tspan></text>

  <!-- L1 Hit Branch -->
  <line x1="320" y1="76" x2="362" y2="76" stroke="#1e7e34" stroke-width="1.8"/>
  <polygon points="360,72 368,76 360,80" fill="#1e7e34"/>
  <rect x="368" y="52" width="194" height="48" rx="6" fill="#edf9ed" stroke="#1e7e34" stroke-width="1.3"/>
  <text x="465" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#145a25">L1 Hit  (1 − MR<tspan dy="2" font-size="9.5">L1</tspan><tspan dy="-2">)</tspan></text>
  <text x="465" y="90" text-anchor="middle" font-size="11" fill="#333">Latency = <tspan font-style="italic">t</tspan><tspan dy="2" font-size="9">hit,L1</tspan><tspan dy="-2"> (~1 ns)</tspan></text>

  <!-- L1 Miss -> L2 -->
  <polyline points="245,114 245,166 362,166" fill="none" stroke="#b85d00" stroke-width="1.8"/>
  <polygon points="360,162 368,166 360,170" fill="#b85d00"/>
  <text x="306" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85d00">L1 Miss</text>
  <text x="306" y="160" text-anchor="middle" font-size="10.5" fill="#b85d00">(MR<tspan dy="2" font-size="8.5">L1</tspan><tspan dy="-2">)</tspan></text>

  <!-- L2 Cache -->
  <rect x="368" y="128" width="156" height="76" rx="6" fill="#fff7cc" stroke="#8a6d00" stroke-width="1.6"/>
  <text x="446" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">L2 Cache (Unified)</text>
  <text x="446" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e5600"><tspan font-style="italic">t</tspan><tspan dy="2" font-size="9.5">hit,L2</tspan><tspan dy="-2"> ≈ 5 ns</tspan></text>
  <text x="446" y="189" text-anchor="middle" font-size="11" fill="#444">Local Miss: MR<tspan dy="2" font-size="9">L2</tspan></text>

  <!-- L2 Hit Branch -->
  <line x1="524" y1="166" x2="562" y2="166" stroke="#8a6d00" stroke-width="1.8"/>
  <polygon points="560,162 568,166 560,170" fill="#8a6d00"/>
  <rect x="568" y="142" width="172" height="48" rx="6" fill="#fffbe6" stroke="#8a6d00" stroke-width="1.3"/>
  <text x="654" y="162" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6e5600">L2 Hit  MR<tspan dy="2" font-size="9">L1</tspan><tspan dy="-2">(1 − MR</tspan><tspan dy="2" font-size="9">L2</tspan><tspan dy="-2">)</tspan></text>
  <text x="654" y="180" text-anchor="middle" font-size="10.5" fill="#333">Latency = <tspan font-style="italic">t</tspan><tspan dy="2" font-size="8.5">hit,L1</tspan><tspan dy="-2"> + </tspan><tspan font-style="italic">t</tspan><tspan dy="2" font-size="8.5">hit,L2</tspan></text>

  <!-- L2 Miss -> DRAM -->
  <polyline points="446,204 446,256 562,256" fill="none" stroke="#a61c3c" stroke-width="1.8"/>
  <polygon points="560,252 568,256 560,260" fill="#a61c3c"/>
  <text x="506" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#a61c3c">L2 Miss</text>
  <text x="506" y="250" text-anchor="middle" font-size="10.5" fill="#a61c3c">(MR<tspan dy="2" font-size="8.5">L1</tspan><tspan dy="-2"> · MR</tspan><tspan dy="2" font-size="8.5">L2</tspan><tspan dy="-2">)</tspan></text>

  <!-- Main Memory (DRAM) -->
  <rect x="568" y="218" width="172" height="76" rx="6" fill="#f9d8dc" stroke="#a61c3c" stroke-width="1.6"/>
  <text x="654" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Main Memory (DRAM)</text>
  <text x="654" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a1430">MP<tspan dy="2" font-size="9.5">L2</tspan><tspan dy="-2"> = 40–100 ns</tspan></text>
  <text x="654" y="279" text-anchor="middle" font-size="10.5" fill="#444">Global: MR<tspan dy="2" font-size="8.5">L1</tspan><tspan dy="-2"> · MR</tspan><tspan dy="2" font-size="8.5">L2</tspan></text>

  <!-- Bottom-Left Formula Summary Box -->
  <rect x="20" y="214" width="398" height="84" rx="6" fill="#f7f7f9" stroke="#555" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="219" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Nested Two-Level AMAT</text>
  <text x="219" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f3fbf">AMAT = <tspan font-style="italic">t</tspan><tspan dy="2" font-size="9">hit,L1</tspan><tspan dy="-2"> + MR</tspan><tspan dy="2" font-size="9">L1</tspan><tspan dy="-2"> · (</tspan><tspan font-style="italic">t</tspan><tspan dy="2" font-size="9">hit,L2</tspan><tspan dy="-2"> + MR</tspan><tspan dy="2" font-size="9">L2</tspan><tspan dy="-2"> · MP</tspan><tspan dy="2" font-size="9">L2</tspan><tspan dy="-2">)</tspan></text>
  <text x="219" y="282" text-anchor="middle" font-size="11" fill="#333">Example: 1.00 + 0.05 × (5.0 + 0.10 × 40) = 1.450 ns</text>
</svg>
