<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="276" viewBox="0 0 760 276" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="13">
  <rect width="760" height="276" fill="#fff"/>

  <text x="380" y="24" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111">Write-Through Cache with 4-Entry FIFO Write Buffer</text>

  <!-- Stage 1: CPU Core -->
  <rect x="18" y="64" width="116" height="114" rx="6" fill="#d8dcff" stroke="#1f3fbf" stroke-width="1.6"/>
  <text x="76" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">CPU Core</text>
  <text x="76" y="116" text-anchor="middle" font-size="11.5" fill="#333">RV32IM Pipeline</text>
  <text x="76" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f3fbf">sw (Store)</text>
  <text x="76" y="156" text-anchor="middle" font-size="11" fill="#444">1-cycle enqueue</text>

  <!-- Arrow CPU -> L1D -->
  <line x1="134" y1="121" x2="168" y2="121" stroke="#333" stroke-width="1.8"/>
  <polygon points="166,117 174,121 166,125" fill="#333"/>
  <text x="152" y="102" text-anchor="middle" font-size="10.5" fill="#333">Addr,</text>
  <text x="152" y="114" text-anchor="middle" font-size="10.5" fill="#333">Data</text>

  <!-- Stage 2: L1D Cache -->
  <rect x="174" y="64" width="136" height="114" rx="6" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.6"/>
  <text x="242" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">L1D Cache</text>
  <text x="242" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#145a25">(Write-Through)</text>
  <text x="242" y="136" text-anchor="middle" font-size="11" fill="#333">Hit: update SRAM</text>
  <text x="242" y="154" text-anchor="middle" font-size="11" fill="#555">Miss: bypass (NWA)</text>

  <!-- Arrow L1D -> Write Buffer Tail -->
  <line x1="310" y1="88" x2="348" y2="88" stroke="#1e7e34" stroke-width="1.8"/>
  <polygon points="346,84 354,88 346,92" fill="#1e7e34"/>
  <text x="331" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e7e34">Enqueue</text>
  <text x="331" y="81" text-anchor="middle" font-size="10" fill="#1e7e34">(1 cycle)</text>

  <!-- Stage 3: 4-Entry FIFO Write Buffer -->
  <rect x="354" y="48" width="206" height="146" rx="6" fill="#fff7cc" stroke="#8a6d00" stroke-width="1.6"/>
  <text x="457" y="67" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5c4800">Write Buffer (4-Entry FIFO)</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="368" y="76" width="178" height="24" rx="3" fill="#fff" stroke="#8a6d00" stroke-width="1.2"/>
    <text x="457" y="92" fill="#333">Tail: (Addr 4, Data 4)</text>

    <rect x="368" y="104" width="178" height="24" rx="3" fill="#fff" stroke="#8a6d00" stroke-width="1.2"/>
    <text x="457" y="120" fill="#333">Slot 3: (Addr 3, Data 3)</text>

    <rect x="368" y="132" width="178" height="24" rx="3" fill="#fff" stroke="#8a6d00" stroke-width="1.2"/>
    <text x="457" y="148" fill="#333">Slot 2: (Addr 2, Data 2)</text>

    <rect x="368" y="160" width="178" height="24" rx="3" fill="#ffe6cc" stroke="#b85d00" stroke-width="1.4"/>
    <text x="457" y="176" font-weight="bold" fill="#7a3b00">Head: (Addr 1, Data 1)</text>
  </g>

  <!-- Arrow Write Buffer Head -> DRAM -->
  <line x1="560" y1="172" x2="602" y2="172" stroke="#b85d00" stroke-width="1.8"/>
  <polygon points="600,168 608,172 600,176" fill="#b85d00"/>
  <text x="583" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85d00">Drain</text>
  <text x="583" y="165" text-anchor="middle" font-size="10" fill="#b85d00">Head</text>

  <!-- Stage 4: Main Memory (DRAM) -->
  <rect x="608" y="64" width="134" height="114" rx="6" fill="#ffe6cc" stroke="#b85d00" stroke-width="1.6"/>
  <text x="675" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">Main Memory</text>
  <text x="675" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c4600">(DRAM)</text>
  <text x="675" y="138" text-anchor="middle" font-size="11" fill="#333">50 ns (100 cycles)</text>
  <text x="675" y="156" text-anchor="middle" font-size="11" fill="#555">Async bus drain</text>

  <!-- Stall Feedback Signal -->
  <polyline points="457,194 457,240 76,240 76,184" fill="none" stroke="#a61c3c" stroke-width="1.8" stroke-dasharray="5,4"/>
  <polygon points="72,186 76,178 80,186" fill="#a61c3c"/>

  <rect x="122" y="226" width="308" height="28" rx="14" fill="#f9d8dc" stroke="#a61c3c" stroke-width="1.3"/>
  <text x="276" y="244" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a1430">FIFO Full (4/4) → Stall CPU (Rate<tspan dy="2" font-size="9">CPU</tspan><tspan dy="-2"> &gt; Rate</tspan><tspan dy="2" font-size="9">DRAM</tspan><tspan dy="-2">)</tspan></text>
</svg>
