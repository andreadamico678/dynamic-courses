<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="350" viewBox="0 0 740 350" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12.5">
  <rect width="740" height="350" fill="#fff"/>

  <!-- Sign-bit indicator at inst[31] -->
  <text x="105.5" y="15" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a61c3c">sign</text>
  <line x1="105.5" y1="18" x2="105.5" y2="23" stroke="#a61c3c" stroke-width="1.2"/>

  <!-- Bit Position Ruler (32 equal 19px columns: x = 96..704) -->
  <g font-family="monospace" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="105.5" y="33" font-weight="bold" fill="#a61c3c">31</text>
    <text x="219.5" y="33">25</text>
    <text x="238.5" y="33">24</text>
    <text x="314.5" y="33">20</text>
    <text x="333.5" y="33">19</text>
    <text x="409.5" y="33">15</text>
    <text x="428.5" y="33">14</text>
    <text x="466.5" y="33">12</text>
    <text x="485.5" y="33">11</text>
    <text x="561.5" y="33">7</text>
    <text x="580.5" y="33">6</text>
    <text x="694.5" y="33">0</text>
  </g>

  <!-- Subtle vertical column alignment guides -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3">
    <line x1="229" y1="38" x2="229" y2="302"/>
    <line x1="324" y1="38" x2="324" y2="302"/>
    <line x1="419" y1="38" x2="419" y2="302"/>
    <line x1="476" y1="38" x2="476" y2="302"/>
    <line x1="571" y1="38" x2="571" y2="302"/>
  </g>

  <!-- Format Labels (Left Column) -->
  <g font-weight="bold" fill="#111">
    <text x="14" y="57">R-type</text>
    <text x="14" y="70" font-family="monospace" font-size="9.5" font-weight="normal" fill="#555">add, mul</text>

    <text x="14" y="101">I-type</text>
    <text x="14" y="114" font-family="monospace" font-size="9.5" font-weight="normal" fill="#555">addi, lw, lbu</text>

    <text x="14" y="145">S-type</text>
    <text x="14" y="158" font-family="monospace" font-size="9.5" font-weight="normal" fill="#555">sw, sb</text>

    <text x="14" y="189">B-type</text>
    <text x="14" y="202" font-family="monospace" font-size="9.5" font-weight="normal" fill="#555">beq, blt, bge</text>

    <text x="14" y="233">U-type</text>
    <text x="14" y="246" font-family="monospace" font-size="9.5" font-weight="normal" fill="#555">lui, auipc</text>

    <text x="14" y="277">J-type</text>
    <text x="14" y="290" font-family="monospace" font-size="9.5" font-weight="normal" fill="#555">jal</text>
  </g>

  <!-- Row 1: R-type (y = 40, h = 34) -->
  <g stroke="#111" stroke-width="1.3" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold">
    <rect x="96"  y="40" width="133" height="34" fill="#f1f5f9"/><text x="162.5" y="61" stroke="none" fill="#111">funct7</text>
    <rect x="229" y="40" width="95"  height="34" fill="#ffe0cc"/><text x="276.5" y="61" stroke="none" fill="#111">rs2</text>
    <rect x="324" y="40" width="95"  height="34" fill="#fff3cd"/><text x="371.5" y="61" stroke="none" fill="#111">rs1</text>
    <rect x="419" y="40" width="57"  height="34" fill="#f1f5f9"/><text x="447.5" y="61" stroke="none" fill="#111" font-size="10.5">funct3</text>
    <rect x="476" y="40" width="95"  height="34" fill="#d8f5d8"/><text x="523.5" y="61" stroke="none" fill="#111">rd</text>
    <rect x="571" y="40" width="133" height="34" fill="#e6ebff"/><text x="637.5" y="61" stroke="none" fill="#111">opcode</text>
  </g>

  <!-- Row 2: I-type (y = 84, h = 34) -->
  <g stroke="#111" stroke-width="1.3" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold">
    <rect x="96"  y="84" width="228" height="34" fill="#f9d8dc"/><text x="210"   y="105" stroke="none" fill="#7f1d1d">imm[11:0]</text>
    <rect x="324" y="84" width="95"  height="34" fill="#fff3cd"/><text x="371.5" y="105" stroke="none" fill="#111">rs1</text>
    <rect x="419" y="84" width="57"  height="34" fill="#f1f5f9"/><text x="447.5" y="105" stroke="none" fill="#111" font-size="10.5">funct3</text>
    <rect x="476" y="84" width="95"  height="34" fill="#d8f5d8"/><text x="523.5" y="105" stroke="none" fill="#111">rd</text>
    <rect x="571" y="84" width="133" height="34" fill="#e6ebff"/><text x="637.5" y="105" stroke="none" fill="#111">opcode</text>
  </g>

  <!-- Row 3: S-type (y = 128, h = 34) -->
  <g stroke="#111" stroke-width="1.3" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold">
    <rect x="96"  y="128" width="133" height="34" fill="#f9d8dc"/><text x="162.5" y="149" stroke="none" fill="#7f1d1d">imm[11:5]</text>
    <rect x="229" y="128" width="95"  height="34" fill="#ffe0cc"/><text x="276.5" y="149" stroke="none" fill="#111">rs2</text>
    <rect x="324" y="128" width="95"  height="34" fill="#fff3cd"/><text x="371.5" y="149" stroke="none" fill="#111">rs1</text>
    <rect x="419" y="128" width="57"  height="34" fill="#f1f5f9"/><text x="447.5" y="149" stroke="none" fill="#111" font-size="10.5">funct3</text>
    <rect x="476" y="128" width="95"  height="34" fill="#f9d8dc"/><text x="523.5" y="149" stroke="none" fill="#7f1d1d">imm[4:0]</text>
    <rect x="571" y="128" width="133" height="34" fill="#e6ebff"/><text x="637.5" y="149" stroke="none" fill="#111">opcode</text>
  </g>

  <!-- Row 4: B-type (y = 172, h = 34) -->
  <g stroke="#111" stroke-width="1.3" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold">
    <rect x="96"  y="172" width="133" height="34" fill="#f9d8dc"/><text x="162.5" y="193" stroke="none" fill="#7f1d1d">imm[12|10:5]</text>
    <rect x="229" y="172" width="95"  height="34" fill="#ffe0cc"/><text x="276.5" y="193" stroke="none" fill="#111" font-size="11.5">rs2</text>
    <rect x="324" y="172" width="95"  height="34" fill="#fff3cd"/><text x="371.5" y="193" stroke="none" fill="#111" font-size="11.5">rs1</text>
    <rect x="419" y="172" width="57"  height="34" fill="#f1f5f9"/><text x="447.5" y="193" stroke="none" fill="#111" font-size="10.5">funct3</text>
    <rect x="476" y="172" width="95"  height="34" fill="#f9d8dc"/><text x="523.5" y="193" stroke="none" fill="#7f1d1d" font-size="10.5">imm[4:1|11]</text>
    <rect x="571" y="172" width="133" height="34" fill="#e6ebff"/><text x="637.5" y="193" stroke="none" fill="#111" font-size="11.5">opcode</text>
  </g>

  <!-- Row 5: U-type (y = 216, h = 34) -->
  <g stroke="#111" stroke-width="1.3" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold">
    <rect x="96"  y="216" width="380" height="34" fill="#f9d8dc"/><text x="286"   y="237" stroke="none" fill="#7f1d1d">imm[31:12]</text>
    <rect x="476" y="216" width="95"  height="34" fill="#d8f5d8"/><text x="523.5" y="237" stroke="none" fill="#111">rd</text>
    <rect x="571" y="216" width="133" height="34" fill="#e6ebff"/><text x="637.5" y="237" stroke="none" fill="#111">opcode</text>
  </g>

  <!-- Row 6: J-type (y = 260, h = 34) -->
  <g stroke="#111" stroke-width="1.3" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold">
    <rect x="96"  y="260" width="380" height="34" fill="#f9d8dc"/><text x="286"   y="281" stroke="none" fill="#7f1d1d">imm[20|10:1|11|19:12]</text>
    <rect x="476" y="260" width="95"  height="34" fill="#d8f5d8"/><text x="523.5" y="281" stroke="none" fill="#111">rd</text>
    <rect x="571" y="260" width="133" height="34" fill="#e6ebff"/><text x="637.5" y="281" stroke="none" fill="#111">opcode</text>
  </g>

  <!-- Bottom alignment brackets / summary labels -->
  <g font-size="10.5" font-weight="bold" text-anchor="middle">
    <text x="276.5" y="313" fill="#9a3412">rs2 [24:20]</text>
    <text x="371.5" y="313" fill="#854d0e">rs1 [19:15]</text>
    <text x="523.5" y="313" fill="#166534">rd [11:7]</text>
    <text x="637.5" y="313" fill="#1e3a8a">opcode [6:0]</text>
  </g>
  <text x="400" y="336" text-anchor="middle" font-size="11.5" fill="#444">Fixed bit positions allow parallel register reads during decode; immediate sign bit always sits at inst[31].</text>
</svg>
