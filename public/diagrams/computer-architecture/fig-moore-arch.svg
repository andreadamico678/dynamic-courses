<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="245" viewBox="0 0 680 245" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="680" height="245" fill="#fff"/>

  <!-- Isolation callout banner -->
  <rect x="200" y="14" width="352" height="26" rx="4" fill="#ecfdf5" stroke="#15803d" stroke-width="1.2"/>
  <text x="376" y="31" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">No direct path from xy to λ (glitch-free, 1-cycle latency)</text>

  <!-- Input xy^t (feeds ONLY next-state logic delta) -->
  <text x="34" y="109" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">
    <tspan font-style="italic">xy</tspan><tspan dy="-5" font-size="10" font-style="italic">t</tspan>
  </text>
  <line x1="52" y1="104" x2="112" y2="104" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Next-State Logic delta -->
  <rect x="115" y="72" width="138" height="68" rx="5" fill="#e6ebff" stroke="#1f3fbf" stroke-width="1.6"/>
  <text x="184" y="101" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Next-State Logic</text>
  <text x="184" y="122" text-anchor="middle" font-size="12.5" fill="#1e3a8a">
    <tspan font-style="italic">δ</tspan>(<tspan font-style="italic">S</tspan><tspan dy="-4" font-size="9.5" font-style="italic">t</tspan><tspan dy="4">, </tspan><tspan font-style="italic">xy</tspan><tspan dy="-4" font-size="9.5" font-style="italic">t</tspan><tspan dy="4">)</tspan>
  </text>

  <!-- Wire delta -> State Register -->
  <line x1="253" y1="106" x2="293" y2="106" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="273" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">
    <tspan font-style="italic">S</tspan><tspan dy="-4" font-size="9.5" font-style="italic">t+1</tspan>
  </text>

  <!-- State Register (Flip-Flops) -->
  <rect x="296" y="72" width="124" height="68" rx="5" fill="#f3f4f6" stroke="#15803d" stroke-width="1.9"/>
  <text x="358" y="101" text-anchor="middle" font-weight="bold" fill="#0f172a">State Register</text>
  <text x="358" y="119" text-anchor="middle" font-size="11.5" fill="#334155">(Flip-Flops)</text>
  <!-- Clock triangle -->
  <polygon points="351,140 358,131 365,140" fill="none" stroke="#1e293b" stroke-width="1.4"/>
  <line x1="358" y1="168" x2="358" y2="142" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="358" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">CLK</text>

  <!-- Wire State Register -> Output Logic lambda -->
  <line x1="420" y1="106" x2="462" y2="106" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="441" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">
    <tspan font-style="italic">S</tspan><tspan dy="-4" font-size="9.5" font-style="italic">t</tspan>
  </text>

  <!-- Present-state feedback loop -->
  <circle cx="441" cy="106" r="3" fill="#1e293b"/>
  <path d="M 441,106 L 441,208 L 88,208 L 88,122 L 112,122" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="265" y="226" text-anchor="middle" font-size="12" fill="#334155">Present State Feedback <tspan font-style="italic">S</tspan><tspan dy="-4" font-size="9" font-style="italic">t</tspan></text>

  <!-- Output Logic lambda (state-only) -->
  <rect x="465" y="72" width="136" height="68" rx="5" fill="#d8f5d8" stroke="#15803d" stroke-width="1.6"/>
  <text x="533" y="101" text-anchor="middle" font-weight="bold" fill="#15803d">Output Logic</text>
  <text x="533" y="122" text-anchor="middle" font-size="12.5" fill="#15803d">
    <tspan font-style="italic">λ</tspan>(<tspan font-style="italic">S</tspan><tspan dy="-4" font-size="9.5" font-style="italic">t</tspan><tspan dy="4">)</tspan>
  </text>

  <!-- Output u^t -->
  <line x1="601" y1="106" x2="646" y2="106" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="662" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">
    <tspan font-style="italic">u</tspan><tspan dy="-5" font-size="10" font-style="italic">t</tspan>
  </text>
</svg>
