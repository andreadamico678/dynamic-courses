<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12.5">
  <rect width="560" height="190" fill="#fff"/>

  <!-- Cycle Title -->
  <text x="280" y="22" text-anchor="middle" font-weight="bold" font-size="13" fill="#222">Clock Cycle 5 — Split-Cycle Register File Access</text>

  <!-- Shaded Half-Cycles -->
  <rect x="110" y="38" width="160" height="96" fill="#fef2f2" stroke="none"/>
  <rect x="270" y="38" width="160" height="96" fill="#eff6ff" stroke="none"/>
  <line x1="270" y1="35" x2="270" y2="140" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Half-Cycle Labels -->
  <text x="190" y="54" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">1st Half: WB Writes rd</text>
  <text x="350" y="54" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">2nd Half: ID Reads rs1, rs2</text>

  <!-- Clock Waveform -->
  <polyline points="55,118 110,118 110,68 270,68 270,118 430,118 430,68 500,68" fill="none" stroke="#111" stroke-width="2.2"/>
  <text x="42" y="96" text-anchor="end" font-weight="bold" font-size="12" fill="#333">CLK</text>

  <!-- Write arrow (1st half) -->
  <line x1="190" y1="73" x2="190" y2="108" stroke="#dc2626" stroke-width="2.2"/>
  <polygon points="185,105 190,114 195,105" fill="#dc2626"/>
  <text x="190" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">x1 ← new value</text>

  <!-- Read arrow (2nd half) -->
  <line x1="350" y1="112" x2="350" y2="77" stroke="#2563eb" stroke-width="2.2"/>
  <polygon points="345,80 350,71 355,80" fill="#2563eb"/>
  <text x="350" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">reads updated x1</text>

  <!-- Footer Note -->
  <text x="280" y="168" text-anchor="middle" font-size="11.5" fill="#444">Distance k = 3 (WB and ID in same cycle): write settles before read, giving 0 stall cycles.</text>
</svg>
