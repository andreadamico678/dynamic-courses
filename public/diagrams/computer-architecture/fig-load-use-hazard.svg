<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="190" viewBox="0 0 640 190" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="13">
  <rect width="640" height="190" fill="#fff"/>

  <!-- Cycle Headers -->
  <g text-anchor="middle" font-weight="bold" fill="#444" font-size="12">
    <text x="155" y="22">C1</text>
    <text x="225" y="22">C2</text>
    <text x="295" y="22">C3</text>
    <text x="365" y="22">C4</text>
    <text x="435" y="22">C5</text>
    <text x="505" y="22">C6</text>
    <text x="575" y="22">C7</text>
  </g>

  <!-- Instruction Labels -->
  <g font-family="monospace" font-size="12" font-weight="bold" fill="#000">
    <text x="12" y="62">lw  x1, 0(x2)</text>
    <text x="12" y="122">add x3, x1, x4</text>
  </g>

  <!-- Row 1: lw x1, 0(x2) -->
  <g stroke="#000" stroke-width="1.3" text-anchor="middle" font-weight="bold">
    <rect x="125" y="40" width="60" height="34" rx="3" fill="#e6ebff"/><text x="155" y="62" stroke="none" fill="#000">IF</text>
    <rect x="195" y="40" width="60" height="34" rx="3" fill="#e6ebff"/><text x="225" y="62" stroke="none" fill="#000">ID</text>
    <rect x="265" y="40" width="60" height="34" rx="3" fill="#e6ebff"/><text x="295" y="62" stroke="none" fill="#000">EX</text>
    <rect x="335" y="40" width="60" height="34" rx="3" fill="#ffe6cc"/><text x="365" y="62" stroke="none" fill="#000">MEM</text>
    <rect x="405" y="40" width="60" height="34" rx="3" fill="#d8f5d8"/><text x="435" y="62" stroke="none" fill="#000">WB</text>
  </g>
  <text x="295" y="91" text-anchor="middle" font-size="10.5" fill="#b45309">x1 ready at end of C4</text>

  <!-- Row 2: add x3, x1, x4 -->
  <g stroke="#000" stroke-width="1.3" text-anchor="middle" font-weight="bold">
    <rect x="195" y="100" width="60" height="34" rx="3" fill="#e6ebff"/><text x="225" y="122" stroke="none" fill="#000">IF</text>
    <rect x="265" y="100" width="60" height="34" rx="3" fill="#e6ebff"/><text x="295" y="122" stroke="none" fill="#000">ID</text>
    <rect x="335" y="100" width="60" height="34" rx="3" fill="#e5e7eb" stroke-dasharray="4,3"/><text x="365" y="122" stroke="none" fill="#c0182b">STALL</text>
    <rect x="405" y="100" width="60" height="34" rx="3" fill="#f9d8dc"/><text x="435" y="122" stroke="none" fill="#000">EX</text>
    <rect x="475" y="100" width="60" height="34" rx="3" fill="#e6ebff"/><text x="505" y="122" stroke="none" fill="#000">MEM</text>
    <rect x="545" y="100" width="60" height="34" rx="3" fill="#e6ebff"/><text x="575" y="122" stroke="none" fill="#000">WB</text>
  </g>

  <!-- Forwarding arrow from end of MEM (x=395, y=74) to start of EX (x=405, y=100) -->
  <path d="M 392,74 L 392,88 L 418,88 L 418,96" fill="none" stroke="#1e7e34" stroke-width="2.2"/>
  <polygon points="414,94 418,101 422,94" fill="#1e7e34"/>
  <text x="515" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e7e34">MEM/WB → EX (ForwardA = 01)</text>

  <text x="320" y="168" text-anchor="middle" font-size="12" fill="#444">Cannot forward backward in time: 1 bubble delays EX from C4 to C5 so MEM/WB data arrives on time.</text>
</svg>
