<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="190" viewBox="0 0 660 190" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12">
  <rect width="660" height="190" fill="#fff"/>

  <text x="330" y="24" text-anchor="middle" font-weight="bold" font-size="13" fill="#222">Additive Breakdown of CPI_pipe = 1.55 cycles/instr</text>

  <!-- Stacked Horizontal Bar -->
  <g stroke="#000" stroke-width="1.3">
    <!-- Base 1.00 (scale: 1.00 = 360px -> start at x=45) -->
    <rect x="45" y="54" width="360" height="46" fill="#dbeafe"/>
    <!-- Struct 0.24 = 86.4px -->
    <rect x="405" y="54" width="86" height="46" fill="#ffedd5"/>
    <!-- Data 0.15 = 54px -->
    <rect x="491" y="54" width="54" height="46" fill="#fee2e2"/>
    <!-- Ctrl 0.16 = 57.6px -->
    <rect x="545" y="54" width="58" height="46" fill="#ede9fe"/>
  </g>

  <!-- Inside Bar Labels -->
  <g text-anchor="middle" font-weight="bold" font-size="11.5" fill="#111">
    <text x="225" y="75">Baseline CPI_ideal</text>
    <text x="225" y="92">1.00</text>

    <text x="448" y="75" fill="#9a3412">Struct.</text>
    <text x="448" y="92" fill="#9a3412">+0.24</text>

    <text x="518" y="75" fill="#991b1b">Data</text>
    <text x="518" y="92" fill="#991b1b">+0.15</text>

    <text x="574" y="75" fill="#5b21b6">Ctrl</text>
    <text x="574" y="92" fill="#5b21b6">+0.16</text>
  </g>

  <!-- Total Bracket / Note -->
  <line x1="45" y1="116" x2="603" y2="116" stroke="#111" stroke-width="1.4"/>
  <line x1="45" y1="110" x2="45" y2="122" stroke="#111" stroke-width="1.4"/>
  <line x1="603" y1="110" x2="603" y2="122" stroke="#111" stroke-width="1.4"/>
  <text x="324" y="138" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#111">Effective CPI_pipe = 1.00 + 0.24 + 0.15 + 0.16 = 1.55 cycles/instr</text>

  <text x="330" y="168" text-anchor="middle" font-size="11.5" fill="#555">Each hazard source adds its weighted stall penalty (f_i x Penalty_i) directly onto the 1.00 baseline.</text>
</svg>
