<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="365" viewBox="0 0 780 365" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1f3fbf"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#a61c3c"/>
    </marker>
  </defs>

  <rect width="780" height="365" fill="#fff"/>

  <!-- Reset entry arrow -->
  <line x1="34" y1="195" x2="87" y2="195" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="56" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Reset</text>

  <!-- Self-loops -->
  <g fill="none" stroke="#1e293b" stroke-width="1.35" marker-end="url(#arr)">
    <!-- S0 self-loop: 00/0, 01/0, 10/0 -->
    <path d="M 94,178 C 60,140 82,118 106,166"/>
    <!-- S1 self-loop: 11/0 -->
    <path d="M 262,171 C 248,132 296,132 282,171"/>
    <!-- S2 self-loop: 10/0 -->
    <path d="M 432,171 C 418,132 466,132 452,171"/>
    <!-- S4 self-loop: 01/0 -->
    <path d="M 689,183 C 734,166 734,224 689,207"/>
  </g>
  <text x="64" y="130" text-anchor="middle" font-size="11" fill="#1e293b">00/0, 01/0, 10/0</text>
  <text x="272" y="132" text-anchor="middle" font-size="11" fill="#1e293b">11/0</text>
  <text x="442" y="132" text-anchor="middle" font-size="11" fill="#1e293b">10/0</text>
  <text x="744" y="199" text-anchor="middle" font-size="11" fill="#1e293b">01/0</text>

  <!-- Primary forward paths (blue) -->
  <g fill="none" stroke="#1f3fbf" stroke-width="1.7" marker-end="url(#arr-blue)">
    <!-- S0 -> S1: 11/0 -->
    <line x1="141" y1="195" x2="247" y2="195"/>
    <!-- S1 -> S2: 10/0 -->
    <line x1="301" y1="195" x2="417" y2="195"/>
    <!-- S2 -> S4 (Branch B): 01/0 -->
    <line x1="471" y1="195" x2="637" y2="195"/>
    <!-- S2 -> S3 (Branch A): 11/0 -->
    <path d="M 463,174 Q 492,130 532,113"/>
    <!-- S3 -> S4 (Branch A): 01/0 -->
    <path d="M 578,116 Q 620,136 649,174"/>
  </g>
  <text x="195" y="187" text-anchor="middle" font-weight="bold" fill="#1f3fbf">11/0</text>
  <text x="360" y="187" text-anchor="middle" font-weight="bold" fill="#1f3fbf">10/0</text>
  <text x="556" y="187" text-anchor="middle" font-weight="bold" fill="#1f3fbf">01/0</text>
  <text x="488" y="130" text-anchor="middle" font-weight="bold" fill="#1f3fbf">11/0</text>
  <text x="632" y="133" text-anchor="middle" font-weight="bold" fill="#1f3fbf">01/0</text>

  <!-- Upper overlap / mismatch arcs from S3 -->
  <g fill="none" stroke="#475569" stroke-width="1.35" marker-end="url(#arr)">
    <!-- S3 -> S2: 10/0 -->
    <path d="M 544,129 Q 516,158 470,184"/>
    <!-- S3 -> S1: 11/0 -->
    <path d="M 531,99 Q 395,58 291,173"/>
    <!-- S3 -> S0: 00/0 -->
    <path d="M 538,87 C 430,14 210,16 123,169"/>
  </g>
  <text x="526" y="160" text-anchor="middle" font-size="11" fill="#334155">10/0</text>
  <text x="394" y="80" text-anchor="middle" font-size="11" fill="#334155">11/0</text>
  <text x="315" y="29" text-anchor="middle" font-size="11" fill="#334155">00/0</text>

  <!-- Lower mismatch / reset arcs -->
  <g fill="none" stroke="#475569" stroke-width="1.35" marker-end="url(#arr)">
    <!-- S1 -> S0: 00/0, 01/0 -->
    <path d="M 257,215 Q 195,246 133,215"/>
    <!-- S2 -> S0: 00/0 -->
    <path d="M 432,218 Q 290,284 128,218"/>
    <!-- S4 -> S1: 11/0 -->
    <path d="M 649,216 Q 480,296 290,217"/>
    <!-- S4 -> S0: 10/0 -->
    <path d="M 656,220 C 550,322 230,322 122,221"/>
  </g>
  <text x="195" y="242" text-anchor="middle" font-size="11" fill="#334155">00/0, 01/0</text>
  <text x="305" y="266" text-anchor="middle" font-size="11" fill="#334155">00/0</text>
  <text x="500" y="268" text-anchor="middle" font-size="11" fill="#334155">11/0</text>
  <text x="390" y="308" text-anchor="middle" font-size="11" fill="#334155">10/0</text>

  <!-- Highlighted recognition arc: S4 -> S0 (00 / 1) -->
  <path d="M 664,222 C 570,352 200,352 114,222" fill="none" stroke="#a61c3c" stroke-width="2.3" marker-end="url(#arr-red)"/>
  <rect x="358" y="328" width="64" height="20" rx="4" fill="#fff1f2" stroke="#a61c3c" stroke-width="1.2"/>
  <text x="390" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#a61c3c">00 / 1</text>

  <!-- State Nodes -->
  <g stroke="#1e293b" stroke-width="1.7" text-anchor="middle">
    <!-- S0 -->
    <circle cx="115" cy="195" r="26" fill="#e6ebff"/>
    <text x="115" y="200" stroke="none" font-size="15" font-weight="bold" fill="#1e3a8a">S<tspan dy="4" font-size="10">0</tspan></text>

    <!-- S1 -->
    <circle cx="275" cy="195" r="26" fill="#f8fafc"/>
    <text x="275" y="200" stroke="none" font-size="15" font-weight="bold" fill="#0f172a">S<tspan dy="4" font-size="10">1</tspan></text>

    <!-- S2 -->
    <circle cx="445" cy="195" r="26" fill="#f8fafc"/>
    <text x="445" y="200" stroke="none" font-size="15" font-weight="bold" fill="#0f172a">S<tspan dy="4" font-size="10">2</tspan></text>

    <!-- S3 -->
    <circle cx="555" cy="108" r="26" fill="#fef3c7"/>
    <text x="555" y="113" stroke="none" font-size="15" font-weight="bold" fill="#92400e">S<tspan dy="4" font-size="10">3</tspan></text>

    <!-- S4 -->
    <circle cx="665" cy="195" r="26" fill="#d8f5d8"/>
    <text x="665" y="200" stroke="none" font-size="15" font-weight="bold" fill="#15803d">S<tspan dy="4" font-size="10">4</tspan></text>
  </g>
</svg>
