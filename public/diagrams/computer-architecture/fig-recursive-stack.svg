<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="404" viewBox="0 0 740 404" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12.5">
  <rect width="740" height="404" fill="#fff"/>

  <!-- Column Headers -->
  <text x="108" y="22" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">1. Recursive Descent (Push)</text>
  <text x="350" y="22" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">Stack Activation Records</text>
  <text x="615" y="22" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">2. LIFO Unwind (Pop)</text>

  <!-- main's Frame (top) -->
  <rect x="225" y="32" width="250" height="26" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="350" y="49" text-anchor="middle" font-size="11.5" fill="#475569">main's Frame (initial sp = sp0)</text>

  <!-- FRAME 1: fact(3) at sp0 - 16 (y = 66..154) -->
  <g stroke="#1f3fbf" stroke-width="1.3" text-anchor="middle">
    <rect x="225" y="66"  width="250" height="22" fill="#d8dcff"/>
    <text x="350" y="81" stroke="none" font-family="monospace" font-size="11" font-weight="bold" fill="#1e3a8a">Frame 1: fact(3)  [sp0 - 16]</text>
    <rect x="225" y="88"  width="250" height="23" fill="#f9d8dc"/>
    <text x="350" y="103" stroke="none" font-family="monospace" font-size="11" fill="#7f1d1d">12(sp): ra -&gt; main</text>
    <rect x="225" y="111" width="250" height="23" fill="#fff3cd"/>
    <text x="350" y="126" stroke="none" font-family="monospace" font-size="11" font-weight="bold" fill="#713f12"> 8(sp): saved a0 (n = 3)</text>
    <rect x="225" y="134" width="250" height="20" fill="#f8fafc"/>
    <text x="350" y="148" stroke="none" font-family="monospace" font-size="10" fill="#64748b">0..7(sp): alignment pad (8 B)</text>
    <rect x="225" y="66" width="250" height="88" fill="none" stroke="#1f3fbf" stroke-width="1.8"/>
  </g>

  <!-- FRAME 2: fact(2) at sp0 - 32 (y = 166..254) -->
  <g stroke="#1e7e34" stroke-width="1.3" text-anchor="middle">
    <rect x="225" y="166" width="250" height="22" fill="#d8f5d8"/>
    <text x="350" y="181" stroke="none" font-family="monospace" font-size="11" font-weight="bold" fill="#14532d">Frame 2: fact(2)  [sp0 - 32]</text>
    <rect x="225" y="188" width="250" height="23" fill="#f9d8dc"/>
    <text x="350" y="203" stroke="none" font-family="monospace" font-size="11" fill="#7f1d1d">12(sp): ra -&gt; fact_rec + 8</text>
    <rect x="225" y="211" width="250" height="23" fill="#fff3cd"/>
    <text x="350" y="226" stroke="none" font-family="monospace" font-size="11" font-weight="bold" fill="#713f12"> 8(sp): saved a0 (n = 2)</text>
    <rect x="225" y="234" width="250" height="20" fill="#f8fafc"/>
    <text x="350" y="248" stroke="none" font-family="monospace" font-size="10" fill="#64748b">0..7(sp): alignment pad (8 B)</text>
    <rect x="225" y="166" width="250" height="88" fill="none" stroke="#1e7e34" stroke-width="1.8"/>
  </g>

  <!-- FRAME 3: fact(1) Base Case at sp0 - 48 (y = 266..354) -->
  <g stroke="#b45309" stroke-width="1.3" text-anchor="middle">
    <rect x="225" y="266" width="250" height="22" fill="#ffe6cc"/>
    <text x="350" y="281" stroke="none" font-family="monospace" font-size="11" font-weight="bold" fill="#7c2d12">Frame 3: fact(1)  [sp0 - 48]</text>
    <rect x="225" y="288" width="250" height="23" fill="#f9d8dc"/>
    <text x="350" y="303" stroke="none" font-family="monospace" font-size="11" fill="#7f1d1d">12(sp): ra -&gt; fact_rec + 8</text>
    <rect x="225" y="311" width="250" height="23" fill="#fff3cd"/>
    <text x="350" y="326" stroke="none" font-family="monospace" font-size="11" font-weight="bold" fill="#713f12"> 8(sp): saved a0 (n = 1)</text>
    <rect x="225" y="334" width="250" height="20" fill="#f8fafc"/>
    <text x="350" y="348" stroke="none" font-family="monospace" font-size="10" fill="#64748b">0..7(sp): alignment pad (8 B)</text>
    <rect x="225" y="266" width="250" height="88" fill="none" stroke="#b45309" stroke-width="1.8"/>
  </g>

  <!-- LEFT: Downward Descent Arrow & Push Labels -->
  <line x1="186" y1="54" x2="186" y2="344" stroke="#1f3fbf" stroke-width="2.2"/>
  <polygon points="181,341 186,351 191,341" fill="#1f3fbf"/>

  <g text-anchor="end" font-family="monospace" font-size="10.5">
    <rect x="22" y="88" width="152" height="36" rx="4" fill="#f4f7ff" stroke="#1f3fbf" stroke-width="1"/>
    <text x="166" y="103" font-weight="bold" fill="#1e3a8a">call fact(3)</text>
    <text x="166" y="118" fill="#444">addi sp, sp, -16</text>

    <rect x="22" y="188" width="152" height="36" rx="4" fill="#f4f7ff" stroke="#1f3fbf" stroke-width="1"/>
    <text x="166" y="203" font-weight="bold" fill="#1e3a8a">call fact(2)</text>
    <text x="166" y="218" fill="#444">addi sp, sp, -16</text>

    <rect x="22" y="288" width="152" height="36" rx="4" fill="#fff7e6" stroke="#b45309" stroke-width="1"/>
    <text x="166" y="303" font-weight="bold" fill="#7c2d12">call fact(1)</text>
    <text x="166" y="318" fill="#444">base case reached!</text>
  </g>

  <!-- Bottom sp pointer -->
  <text x="136" y="358" text-anchor="end" font-family="monospace" font-size="11" font-weight="bold" fill="#b45309">sp = sp0 - 48</text>
  <line x1="142" y1="354" x2="219" y2="354" stroke="#b45309" stroke-width="1.8"/>
  <polygon points="216,350 224,354 216,358" fill="#b45309"/>

  <!-- RIGHT: Upward LIFO Unwind Arrow & Return Boxes -->
  <line x1="504" y1="346" x2="504" y2="60" stroke="#1e7e34" stroke-width="2.2"/>
  <polygon points="499,63 504,53 509,63" fill="#1e7e34"/>

  <g font-size="11">
    <!-- Unwind 1: fact(1) -->
    <rect x="520" y="286" width="204" height="44" rx="5" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/>
    <text x="530" y="304" font-weight="bold" fill="#7c2d12">Base case (n &lt;= 1):</text>
    <text x="530" y="321" font-family="monospace" font-size="10.5" fill="#111">a0 = 1, pop +16 B, ret</text>

    <!-- Unwind 2: fact(2) -->
    <rect x="520" y="186" width="204" height="44" rx="5" fill="#e8f8e8" stroke="#1e7e34" stroke-width="1.2"/>
    <text x="530" y="204" font-weight="bold" fill="#14532d">Reload n = 2 from 8(sp):</text>
    <text x="530" y="221" font-family="monospace" font-size="10.5" fill="#111">a0 = 2 * 1 = 2, pop +16 B</text>

    <!-- Unwind 3: fact(3) -->
    <rect x="520" y="86" width="204" height="44" rx="5" fill="#e6ebff" stroke="#1f3fbf" stroke-width="1.2"/>
    <text x="530" y="104" font-weight="bold" fill="#1e3a8a">Reload n = 3 from 8(sp):</text>
    <text x="530" y="121" font-family="monospace" font-size="10.5" fill="#111">a0 = 3 * 2 = 6 -&gt; main</text>
  </g>

  <!-- Footer Note -->
  <text x="370" y="388" text-anchor="middle" font-size="11.5" fill="#444">Peak stack memory for fact(n) is B_peak = n * 16 bytes (O(n) space; 48 B simultaneous for fact(3)).</text>
</svg>
