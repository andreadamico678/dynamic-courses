<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="335" viewBox="0 0 720 335" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12.5">
  <rect width="720" height="335" fill="#fff"/>

  <!-- TOP ZONE: User Mode (U-Mode) -->
  <rect x="16" y="12" width="688" height="122" rx="8" fill="#f4f7ff" stroke="#1f3fbf" stroke-width="1.4"/>
  <text x="28" y="30" font-size="12" font-weight="bold" fill="#1e3a8a">User Mode (U-Mode — Unprivileged Program)</text>

  <!-- User Code Box (Left) -->
  <rect x="34" y="40" width="232" height="82" rx="5" fill="#fff" stroke="#1f3fbf" stroke-width="1.4"/>
  <text x="46" y="56" font-size="11" font-weight="bold" fill="#1e3a8a">Prepare Arguments &amp; Trap:</text>
  <g font-family="monospace" font-size="11" fill="#111">
    <text x="46" y="75">la   a0, str_prompt</text>
    <text x="46" y="92">li   a7, 4          # PrintString</text>
    <text x="46" y="109" font-weight="bold" fill="#a61c3c">ecall               # PC traps</text>
  </g>

  <!-- Dashed Logical Continuation in User Space -->
  <line x1="266" y1="81" x2="446" y2="81" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <polygon points="443,77 451,81 443,85" fill="#64748b"/>
  <text x="358" y="74" text-anchor="middle" font-size="11" fill="#475569">Execution blocked until handler finishes</text>

  <!-- Resume Box (Right) -->
  <rect x="454" y="40" width="232" height="82" rx="5" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.4"/>
  <text x="570" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Resume User Code</text>
  <g font-family="monospace" font-size="11" fill="#111" text-anchor="middle">
    <text x="570" y="78">PC &lt;- sepc + 4</text>
    <text x="570" y="96">Return value in a0</text>
    <text x="570" y="112" font-family="'Latin Modern Roman',serif" font-size="10.5" fill="#166534">(e.g., mv t0, a0 after ReadInt)</text>
  </g>

  <!-- PRIVILEGE BOUNDARY LINE -->
  <line x1="16" y1="157" x2="704" y2="157" stroke="#a61c3c" stroke-width="2" stroke-dasharray="7,4"/>
  <rect x="208" y="145" width="304" height="24" rx="12" fill="#fff5f5" stroke="#a61c3c" stroke-width="1.2"/>
  <text x="360" y="161" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a61c3c">Hardware Privilege Boundary (User &lt;-&gt; S/M-Mode)</text>

  <!-- BOTTOM ZONE: Privileged OS / RARS Trap Handler -->
  <rect x="16" y="180" width="688" height="142" rx="8" fill="#fff8f0" stroke="#b45309" stroke-width="1.4"/>
  <text x="28" y="313" font-size="12" font-weight="bold" fill="#9a3412">Privileged Mode (Supervisor / Machine — OS Kernel or RARS Simulator Handler)</text>

  <!-- Step 1: Trap Entry -->
  <rect x="34" y="196" width="176" height="96" rx="5" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
  <text x="122" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">1. Trap Entry</text>
  <g font-size="11" fill="#222" text-anchor="middle">
    <text x="122" y="234" font-family="monospace">sepc &lt;- PC</text>
    <text x="122" y="254">Raise privilege mode</text>
    <text x="122" y="274">Jump to trap handler</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="210" y1="244" x2="238" y2="244" stroke="#b45309" stroke-width="1.8"/>
  <polygon points="235,240 243,244 235,248" fill="#b45309"/>

  <!-- Step 2: Inspect a7 Dispatch Table -->
  <rect x="245" y="192" width="230" height="104" rx="5" fill="#fff7cc" stroke="#b45309" stroke-width="1.5"/>
  <text x="360" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">2. Dispatch on Register a7</text>
  <g font-family="monospace" font-size="10.5" fill="#111">
    <text x="259" y="232">a7 = 1 : PrintInt</text>
    <text x="259" y="251">a7 = 4 : PrintString</text>
    <text x="259" y="270">a7 = 5 : ReadInt</text>
    <text x="259" y="287">a7 = 8 : ReadString</text>
  </g>
  <g font-family="monospace" font-size="10.5" fill="#111">
    <text x="394" y="232">10: Exit</text>
    <text x="394" y="251">11: PrintChar</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="475" y1="244" x2="503" y2="244" stroke="#b45309" stroke-width="1.8"/>
  <polygon points="500,240 508,244 500,248" fill="#b45309"/>

  <!-- Step 3: Console I/O Driver -->
  <rect x="510" y="196" width="176" height="96" rx="5" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
  <text x="598" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">3. Console Driver</text>
  <g font-size="11" fill="#222" text-anchor="middle">
    <text x="598" y="234">Reads args in a0, a1</text>
    <text x="598" y="254">Performs terminal I/O</text>
    <text x="598" y="274">Writes result into a0</text>
  </g>

  <!-- Vertical Boundary-Crossing Arrows -->
  <!-- Downward ecall trap -->
  <line x1="122" y1="122" x2="122" y2="190" stroke="#a61c3c" stroke-width="2.2"/>
  <polygon points="117,187 122,196 127,187" fill="#a61c3c"/>
  <rect x="74" y="147" width="96" height="20" rx="4" fill="#fff" stroke="#a61c3c" stroke-width="1"/>
  <text x="122" y="161" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#a61c3c">ecall trap</text>

  <!-- Upward sret / mret return -->
  <line x1="598" y1="196" x2="598" y2="128" stroke="#1e7e34" stroke-width="2.2"/>
  <polygon points="593,131 598,122 603,131" fill="#1e7e34"/>
  <rect x="546" y="147" width="104" height="20" rx="4" fill="#fff" stroke="#1e7e34" stroke-width="1"/>
  <text x="598" y="161" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#1e7e34">sret / mret</text>
</svg>
