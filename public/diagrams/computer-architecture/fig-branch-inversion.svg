<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12.5">
  <rect width="720" height="334" fill="#fff"/>

  <!-- Left Panel: High-Level C Semantics -->
  <text x="166" y="24" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">High-Level C Semantics</text>
  <text x="166" y="42" text-anchor="middle" font-family="monospace" font-size="11" fill="#444">if (a &lt; b) &#123; then &#125; else &#123; else &#125;</text>

  <!-- Decision Diamond -->
  <polygon points="166,64 230,96 166,128 102,96" fill="#fff7cc" stroke="#111" stroke-width="1.4"/>
  <text x="166" y="100" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#111">a &lt; b ?</text>

  <!-- True Branch -> then -->
  <polyline points="102,96 80,96 80,156" fill="none" stroke="#1e7e34" stroke-width="1.8"/>
  <polygon points="76,153 80,161 84,153" fill="#1e7e34"/>
  <text x="72" y="88" text-anchor="end" font-size="11" font-weight="bold" fill="#1e7e34">True</text>

  <rect x="28" y="162" width="104" height="38" rx="5" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.5"/>
  <text x="80" y="185" text-anchor="middle" font-weight="bold" fill="#14532d">then block</text>

  <!-- False Branch -> else -->
  <polyline points="230,96 252,96 252,156" fill="none" stroke="#b45309" stroke-width="1.8"/>
  <polygon points="248,153 252,161 256,153" fill="#b45309"/>
  <text x="260" y="88" text-anchor="start" font-size="11" font-weight="bold" fill="#b45309">False</text>

  <rect x="200" y="162" width="104" height="38" rx="5" fill="#ffe6cc" stroke="#b45309" stroke-width="1.5"/>
  <text x="252" y="185" text-anchor="middle" font-weight="bold" fill="#7c2d12">else block</text>

  <!-- Merge into end_if -->
  <polyline points="80,200 80,260 100,260" fill="none" stroke="#333" stroke-width="1.6"/>
  <polygon points="97,256 105,260 97,264" fill="#333"/>
  <polyline points="252,200 252,260 232,260" fill="none" stroke="#333" stroke-width="1.6"/>
  <polygon points="235,256 227,260 235,264" fill="#333"/>

  <rect x="106" y="244" width="120" height="32" rx="5" fill="#f1f5f9" stroke="#333" stroke-width="1.4"/>
  <text x="166" y="264" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#111">end_if</text>

  <!-- Panel Divider -->
  <line x1="334" y1="16" x2="334" y2="298" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Right Panel: RISC-V Branch Inversion -->
  <text x="528" y="24" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">RISC-V Assembly (Branch Inversion)</text>
  <text x="528" y="42" text-anchor="middle" font-size="11" fill="#444">Instructions execute top-to-bottom unless a branch is taken</text>

  <!-- Block 1: Inverted Guard (bge) -->
  <rect x="434" y="58" width="174" height="40" rx="5" fill="#f9d8dc" stroke="#a61c3c" stroke-width="1.6"/>
  <text x="521" y="75" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#7f1d1d">bge a, b, else_lbl</text>
  <text x="521" y="91" text-anchor="middle" font-size="10.5" fill="#7f1d1d">Test negated: a &gt;= b</text>

  <!-- Straight Fall-through to then -->
  <line x1="521" y1="98" x2="521" y2="122" stroke="#1e7e34" stroke-width="1.8"/>
  <polygon points="517,119 521,127 525,119" fill="#1e7e34"/>
  <text x="530" y="116" text-anchor="start" font-size="10.5" font-weight="bold" fill="#1e7e34">Not taken (a &lt; b)</text>

  <!-- Block 2: then -->
  <rect x="434" y="128" width="174" height="32" rx="5" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.5"/>
  <text x="521" y="148" text-anchor="middle" font-weight="bold" fill="#14532d">then block (fall-through)</text>

  <!-- Straight to j end_if -->
  <line x1="521" y1="160" x2="521" y2="171" stroke="#333" stroke-width="1.5"/>
  <polygon points="517,168 521,175 525,168" fill="#333"/>

  <!-- Block 3: j end_if -->
  <rect x="434" y="176" width="174" height="28" rx="5" fill="#e6ebff" stroke="#1f3fbf" stroke-width="1.5"/>
  <text x="521" y="194" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#1e3a8a">j end_if</text>

  <!-- Block 4: else_lbl -->
  <rect x="434" y="218" width="174" height="34" rx="5" fill="#ffe6cc" stroke="#b45309" stroke-width="1.5"/>
  <text x="521" y="239" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#7c2d12">else_lbl:  else</text>

  <!-- Straight to end_if -->
  <line x1="521" y1="252" x2="521" y2="265" stroke="#333" stroke-width="1.5"/>
  <polygon points="517,262 521,269 525,262" fill="#333"/>

  <!-- Block 5: end_if -->
  <rect x="434" y="270" width="174" height="28" rx="5" fill="#f1f5f9" stroke="#333" stroke-width="1.4"/>
  <text x="521" y="288" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#111">end_if:  next stmt</text>

  <!-- Right-side Taken Jump: bge -> else_lbl -->
  <polyline points="608,78 662,78 662,235 613,235" fill="none" stroke="#a61c3c" stroke-width="1.9"/>
  <polygon points="616,231 608,235 616,239" fill="#a61c3c"/>
  <rect x="625" y="142" width="76" height="32" rx="4" fill="#fff" stroke="#a61c3c" stroke-width="1"/>
  <text x="663" y="156" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a61c3c">Taken</text>
  <text x="663" y="169" text-anchor="middle" font-family="monospace" font-size="10" fill="#a61c3c">a &gt;= b</text>

  <!-- Left-side Unconditional Jump: j end_if -> end_if -->
  <polyline points="434,190 382,190 382,284 429,284" fill="none" stroke="#1f3fbf" stroke-width="1.9"/>
  <polygon points="426,280 434,284 426,288" fill="#1f3fbf"/>
  <rect x="348" y="226" width="68" height="22" rx="4" fill="#fff" stroke="#1f3fbf" stroke-width="1"/>
  <text x="382" y="241" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1f3fbf">skip else</text>

  <!-- Footer Note -->
  <text x="360" y="321" text-anchor="middle" font-size="11.5" fill="#444">Inverted guard (bge) jumps forward to else_lbl when a &lt; b fails; j end_if prevents then from falling into else_lbl.</text>
</svg>
