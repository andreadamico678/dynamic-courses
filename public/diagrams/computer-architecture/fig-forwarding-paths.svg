<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="13">
  <rect width="640" height="230" fill="#fff"/>

  <!-- Interstage Register Labels -->
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">
    <text x="36" y="24">ID/EX</text>
    <text x="290" y="24">EX/MEM</text>
    <text x="466" y="24">MEM/WB</text>
  </g>

  <!-- Pipeline Registers -->
  <g fill="#d1d5db" stroke="#000" stroke-width="1.6">
    <rect x="28" y="32" width="16" height="84"/>
    <rect x="282" y="32" width="16" height="84"/>
    <rect x="458" y="32" width="16" height="84"/>
  </g>

  <!-- 3-to-1 ALU MUX -->
  <polygon points="105,40 155,54 155,104 105,118" fill="#fef9c3" stroke="#000" stroke-width="1.5"/>
  <text x="136" y="83" text-anchor="middle" font-weight="bold" font-size="12">MUX</text>
  <text x="109" y="65" font-size="9.5" font-weight="bold">00</text>
  <text x="109" y="85" font-size="9.5" font-weight="bold" fill="#c0182b">10</text>
  <text x="109" y="103" font-size="9.5" font-weight="bold" fill="#1f3fbf">01</text>

  <!-- ALU, MEM, WB blocks -->
  <rect x="192" y="52" width="56" height="44" rx="3" fill="#e6ebff" stroke="#000" stroke-width="1.5"/>
  <text x="220" y="79" text-anchor="middle" font-weight="bold">ALU</text>

  <rect x="342" y="52" width="70" height="44" rx="3" fill="#e6ebff" stroke="#000" stroke-width="1.5"/>
  <text x="377" y="79" text-anchor="middle" font-weight="bold">MEM</text>

  <rect x="518" y="52" width="60" height="44" rx="3" fill="#e6ebff" stroke="#000" stroke-width="1.5"/>
  <text x="548" y="79" text-anchor="middle" font-weight="bold">WB</text>

  <!-- Forwarding Unit -->
  <rect x="175" y="172" width="130" height="42" rx="4" fill="#f3e8ff" stroke="#000" stroke-width="1.5"/>
  <text x="240" y="191" text-anchor="middle" font-weight="bold">Forwarding</text>
  <text x="240" y="206" text-anchor="middle" font-weight="bold">Unit</text>

  <!-- Forward datapath wires -->
  <g stroke="#000" stroke-width="1.6" fill="none">
    <line x1="44" y1="62" x2="100" y2="62"/><polygon points="97,58 105,62 97,66" fill="#000"/>
    <line x1="155" y1="74" x2="187" y2="74"/><polygon points="184,70 192,74 184,78" fill="#000"/>
    <line x1="248" y1="74" x2="277" y2="74"/><polygon points="274,70 282,74 274,78" fill="#000"/>
    <line x1="298" y1="74" x2="337" y2="74"/><polygon points="334,70 342,74 334,78" fill="#000"/>
    <line x1="412" y1="74" x2="453" y2="74"/><polygon points="450,70 458,74 450,78" fill="#000"/>
    <line x1="474" y1="74" x2="513" y2="74"/><polygon points="510,70 518,74 510,78" fill="#000"/>
  </g>
  <text x="74" y="54" text-anchor="middle" font-size="11.5" font-style="italic">Data1</text>

  <!-- EX Hazard Bypass (red) -->
  <polyline points="318,74 318,136 90,136 90,82 100,82" fill="none" stroke="#c0182b" stroke-width="1.8"/>
  <polygon points="97,78 105,82 97,86" fill="#c0182b"/>
  <text x="215" y="131" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c0182b">EX Hazard Bypass (k = 1)</text>

  <!-- MEM Hazard Bypass (blue) -->
  <polyline points="494,74 494,156 76,156 76,100 100,100" fill="none" stroke="#1f3fbf" stroke-width="1.8"/>
  <polygon points="97,96 105,100 97,104" fill="#1f3fbf"/>
  <text x="392" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f3fbf">MEM Hazard Bypass (k = 2)</text>

  <!-- Control line from Forwarding Unit to MUX -->
  <polyline points="175,193 130,193 130,117" fill="none" stroke="#000" stroke-width="1.4" stroke-dasharray="4,3"/>
  <polygon points="126,120 130,112 134,120" fill="#000"/>
  <text x="148" y="187" text-anchor="middle" font-size="10.5" font-weight="bold">ForwardA</text>
</svg>
