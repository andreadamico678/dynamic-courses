<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="13">
  <rect width="760" height="360" fill="#fff"/>

  <text x="380" y="25" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111">The 3 C's Cache Miss Taxonomy &amp; Diagnostic Exclusion Filter</text>

  <!-- Column Headers -->
  <text x="128" y="47" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">Diagnostic Simulation (Fixed B)</text>
  <text x="390" y="47" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">Isolated Miss Category</text>
  <text x="632" y="47" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">Hardware Fix &amp; Side-Effect</text>

  <!-- Row 1: Compulsory -->
  <rect x="20" y="56" width="216" height="68" rx="6" fill="#d8dcff" stroke="#1f3fbf" stroke-width="1.5"/>
  <text x="128" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">1. Infinite Cache (<tspan font-style="italic">C</tspan> = ∞)</text>
  <text x="128" y="104" text-anchor="middle" font-size="11.5" fill="#333">Unlimited slots, block size <tspan font-style="italic">B</tspan></text>

  <line x1="236" y1="90" x2="268" y2="90" stroke="#333" stroke-width="1.7"/>
  <polygon points="266,86 274,90 266,94" fill="#333"/>

  <rect x="274" y="56" width="232" height="68" rx="6" fill="#f9d8dc" stroke="#a61c3c" stroke-width="1.5"/>
  <text x="390" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a1430">Compulsory (Cold) Misses</text>
  <text x="390" y="104" text-anchor="middle" font-size="12" fill="#222">Misses<tspan dy="3" font-size="9.5">comp</tspan><tspan dy="-3"> = Misses</tspan><tspan dy="3" font-size="9.5">∞</tspan></text>

  <rect x="524" y="56" width="216" height="68" rx="6" fill="#f7f7f9" stroke="#666" stroke-width="1.2"/>
  <text x="632" y="83" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#145a25">Fix: ↑ Block size <tspan font-style="italic">B</tspan> / Prefetch</text>
  <text x="632" y="104" text-anchor="middle" font-size="11" fill="#8a1430">Cost: ↑ MP, fewer blocks <tspan font-style="italic">NB</tspan></text>

  <!-- Step Arrow 1 -> 2 -->
  <line x1="128" y1="124" x2="128" y2="140" stroke="#1f3fbf" stroke-width="1.6"/>
  <polygon points="124,138 128,146 132,138" fill="#1f3fbf"/>
  <text x="137" y="138" font-size="10.5" fill="#1f3fbf">Restrict to finite <tspan font-style="italic">C</tspan></text>

  <!-- Row 2: Capacity -->
  <rect x="20" y="146" width="216" height="68" rx="6" fill="#d8dcff" stroke="#1f3fbf" stroke-width="1.5"/>
  <text x="128" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">2. Fully Associative (Size <tspan font-style="italic">C</tspan>)</text>
  <text x="128" y="194" text-anchor="middle" font-size="11.5" fill="#333">Finite capacity <tspan font-style="italic">C</tspan>, <tspan font-style="italic">N</tspan> = <tspan font-style="italic">NB</tspan></text>

  <line x1="236" y1="180" x2="268" y2="180" stroke="#333" stroke-width="1.7"/>
  <polygon points="266,176 274,180 266,184" fill="#333"/>

  <rect x="274" y="146" width="232" height="68" rx="6" fill="#ffe6cc" stroke="#b85d00" stroke-width="1.5"/>
  <text x="390" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c4600">+ Capacity Misses</text>
  <text x="390" y="194" text-anchor="middle" font-size="12" fill="#222">Misses<tspan dy="3" font-size="9.5">cap</tspan><tspan dy="-3"> = Misses</tspan><tspan dy="3" font-size="9.5">FA</tspan><tspan dy="-3"> − Misses</tspan><tspan dy="3" font-size="9.5">∞</tspan></text>

  <rect x="524" y="146" width="216" height="68" rx="6" fill="#f7f7f9" stroke="#666" stroke-width="1.2"/>
  <text x="632" y="173" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#145a25">Fix: ↑ Total capacity <tspan font-style="italic">C</tspan></text>
  <text x="632" y="194" text-anchor="middle" font-size="11" fill="#8a1430">Cost: ↑ <tspan font-style="italic">t</tspan><tspan dy="2" font-size="9">hit</tspan><tspan dy="-2">, area &amp; power</tspan></text>

  <!-- Step Arrow 2 -> 3 -->
  <line x1="128" y1="214" x2="128" y2="230" stroke="#1f3fbf" stroke-width="1.6"/>
  <polygon points="124,228 128,236 132,228" fill="#1f3fbf"/>
  <text x="137" y="228" font-size="10.5" fill="#1f3fbf">Restrict to <tspan font-style="italic">N</tspan> ways/set</text>

  <!-- Row 3: Conflict -->
  <rect x="20" y="236" width="216" height="68" rx="6" fill="#d8dcff" stroke="#1f3fbf" stroke-width="1.5"/>
  <text x="128" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">3. <tspan font-style="italic">N</tspan>-Way / Direct-Mapped</text>
  <text x="128" y="284" text-anchor="middle" font-size="11.5" fill="#333">Same <tspan font-style="italic">C</tspan> and <tspan font-style="italic">B</tspan>, limited <tspan font-style="italic">N</tspan></text>

  <line x1="236" y1="270" x2="268" y2="270" stroke="#333" stroke-width="1.7"/>
  <polygon points="266,266 274,270 266,274" fill="#333"/>

  <rect x="274" y="236" width="232" height="68" rx="6" fill="#fff7cc" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="390" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e5600">+ Conflict (Collision) Misses</text>
  <text x="390" y="284" text-anchor="middle" font-size="12" fill="#222">Misses<tspan dy="3" font-size="9.5">conf</tspan><tspan dy="-3"> = Misses</tspan><tspan dy="3" font-size="9.5">N-way</tspan><tspan dy="-3"> − Misses</tspan><tspan dy="3" font-size="9.5">FA</tspan></text>

  <rect x="524" y="236" width="216" height="68" rx="6" fill="#f7f7f9" stroke="#666" stroke-width="1.2"/>
  <text x="632" y="263" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#145a25">Fix: ↑ Associativity <tspan font-style="italic">N</tspan> / Victim</text>
  <text x="632" y="284" text-anchor="middle" font-size="11" fill="#8a1430">Cost: ↑ <tspan font-style="italic">t</tspan><tspan dy="2" font-size="9">hit</tspan><tspan dy="-2"> (</tspan><tspan font-style="italic">N</tspan> comparators)</text>

  <!-- Bottom Additive Conservation Bar -->
  <text x="20" y="337" font-size="12" font-weight="bold" fill="#222">Total Misses =</text>

  <rect x="116" y="318" width="174" height="28" rx="4" fill="#f9d8dc" stroke="#a61c3c" stroke-width="1.3"/>
  <text x="203" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a1430">Compulsory</text>

  <text x="301" y="337" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">+</text>

  <rect x="312" y="318" width="186" height="28" rx="4" fill="#ffe6cc" stroke="#b85d00" stroke-width="1.3"/>
  <text x="405" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c4600">Capacity</text>

  <text x="509" y="337" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">+</text>

  <rect x="520" y="318" width="220" height="28" rx="4" fill="#fff7cc" stroke="#8a6d00" stroke-width="1.3"/>
  <text x="630" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e5600">Conflict (0 if FA)</text>
</svg>
