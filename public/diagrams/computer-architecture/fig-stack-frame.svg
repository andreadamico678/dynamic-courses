<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="690" height="368" viewBox="0 0 690 368" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12.5">
  <rect width="690" height="368" fill="#fff"/>

  <!-- High / Low Address Headers -->
  <text x="332" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">High Addresses</text>

  <!-- Caller Frame (dashed) -->
  <rect x="212" y="28" width="240" height="30" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="332" y="48" text-anchor="middle" font-size="11.5" fill="#475569">Caller's Stack Frame</text>

  <!-- Stack Growth Arrow (Far Left) -->
  <line x1="28" y1="64" x2="28" y2="306" stroke="#1f3fbf" stroke-width="2"/>
  <polygon points="23,303 28,312 33,303" fill="#1f3fbf"/>
  <text x="40" y="176" font-size="11" font-weight="bold" fill="#1e3a8a">Stack grows</text>
  <text x="40" y="192" font-size="11" font-weight="bold" fill="#1e3a8a">downward</text>
  <text x="40" y="210" font-family="monospace" font-size="10.5" fill="#1e3a8a">addi sp,sp,-48</text>

  <!-- old sp pointer at y = 58 -->
  <text x="40" y="62" font-family="monospace" font-size="11" font-weight="bold" fill="#475569">old sp (+48)</text>
  <line x1="126" y1="58" x2="206" y2="58" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="203,54 211,58 203,62" fill="#475569"/>

  <!-- Byte Offsets Column (x = 204 right-aligned) -->
  <g font-family="monospace" font-size="11" fill="#333" text-anchor="end">
    <text x="204" y="80">44(sp)</text>
    <text x="204" y="114">40(sp)</text>
    <text x="204" y="148">36(sp)</text>
    <text x="204" y="180">32(sp)</text>
    <text x="204" y="226">16(sp)</text>
    <text x="204" y="286">0(sp)</text>
  </g>

  <!-- 48-Byte Stack Frame Slots (x = 212, w = 240, y = 58..310) -->
  <g stroke="#111" stroke-width="1.4" text-anchor="middle">
    <!-- 44(sp): ra (4 B) -->
    <rect x="212" y="58" width="240" height="34" fill="#f9d8dc"/>
    <text x="332" y="79" stroke="none" font-weight="bold" fill="#7f1d1d">Saved <tspan font-family="monospace">ra</tspan> (return addr, 4 B)</text>

    <!-- 40(sp): s0 (4 B) -->
    <rect x="212" y="92" width="240" height="34" fill="#fff3cd"/>
    <text x="332" y="113" stroke="none" font-weight="bold" fill="#713f12">Saved <tspan font-family="monospace">s0</tspan> (len1, 4 B)</text>

    <!-- 36(sp): s1 (4 B) -->
    <rect x="212" y="126" width="240" height="34" fill="#fff3cd"/>
    <text x="332" y="147" stroke="none" font-weight="bold" fill="#713f12">Saved <tspan font-family="monospace">s1</tspan> (len2, 4 B)</text>

    <!-- 32(sp): Padding (4 B) -->
    <rect x="212" y="160" width="240" height="30" fill="#f1f5f9"/>
    <text x="332" y="179" stroke="none" font-size="11.5" fill="#475569">Alignment Padding (4 B unused)</text>

    <!-- 16(sp): seconda[16] (16 B) -->
    <rect x="212" y="190" width="240" height="60" fill="#e6ebff"/>
    <text x="332" y="216" stroke="none" font-family="monospace" font-size="12" font-weight="bold" fill="#1e3a8a">char seconda[16]</text>
    <text x="332" y="234" stroke="none" font-size="11" fill="#1e3a8a">bytes sp+16 .. sp+31 (16 B)</text>

    <!-- 0(sp): prima[16] (16 B) -->
    <rect x="212" y="250" width="240" height="60" fill="#d8f5d8"/>
    <text x="332" y="276" stroke="none" font-family="monospace" font-size="12" font-weight="bold" fill="#14532d">char prima[16]</text>
    <text x="332" y="294" stroke="none" font-size="11" fill="#14532d">bytes sp+0 .. sp+15 (16 B)</text>
  </g>

  <!-- Outer bold border around the 48-byte frame -->
  <rect x="212" y="58" width="240" height="252" fill="none" stroke="#111" stroke-width="2"/>

  <!-- Current sp pointer at y = 310 -->
  <text x="40" y="314" font-family="monospace" font-size="11.5" font-weight="bold" fill="#1f3fbf">new sp (+0)</text>
  <line x1="126" y1="310" x2="206" y2="310" stroke="#1f3fbf" stroke-width="2"/>
  <polygon points="203,305 212,310 203,315" fill="#1f3fbf"/>

  <!-- Right-side Assembly Usage Callouts -->
  <g font-family="monospace" font-size="11" fill="#111">
    <text x="468" y="79" fill="#7f1d1d">sw ra, 44(sp)  / lw ra, 44(sp)</text>
    <text x="468" y="113" fill="#713f12">sw s0, 40(sp)  / lw s0, 40(sp)</text>
    <text x="468" y="147" fill="#713f12">sw s1, 36(sp)  / lw s1, 36(sp)</text>
    <text x="468" y="179" font-family="'Latin Modern Roman',serif" font-size="11" fill="#475569">44 B raw -&gt; 48 B (mod 16 = 0)</text>
    <text x="468" y="216" font-weight="bold" fill="#1e3a8a">addi a0, sp, 16</text>
    <text x="468" y="232" font-family="'Latin Modern Roman',serif" font-size="11" fill="#444">passes &amp;seconda[0] to ecall/strlen</text>
    <text x="468" y="276" font-weight="bold" fill="#14532d">addi a0, sp, 0</text>
    <text x="468" y="292" font-family="'Latin Modern Roman',serif" font-size="11" fill="#444">passes &amp;prima[0] to ecall/strlen</text>
  </g>

  <!-- Low Address Footer -->
  <text x="332" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Low Addresses</text>
  <text x="345" y="356" text-anchor="middle" font-size="11.5" fill="#444">Frame size K = 48 bytes: buffers grow upward from 0(sp), saved registers sit at top word slots (K - 4 down).</text>
</svg>
