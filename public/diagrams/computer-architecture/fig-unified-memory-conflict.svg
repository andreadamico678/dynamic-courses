<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="235" viewBox="0 0 660 235" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12.5">
  <rect width="660" height="235" fill="#fff"/>

  <!-- Cycle Headers -->
  <g text-anchor="middle" font-weight="bold" fill="#444" font-size="12">
    <text x="195" y="22">C1</text>
    <text x="260" y="22">C2</text>
    <text x="325" y="22">C3</text>
    <text x="390" y="22" fill="#c0182b">C4</text>
    <text x="455" y="22">C5</text>
    <text x="520" y="22">C6</text>
    <text x="585" y="22">C7</text>
  </g>

  <!-- Instruction Labels -->
  <g font-family="monospace" font-size="11.5" font-weight="bold" fill="#111">
    <text x="12" y="59">lw   t0, 0(s0)</text>
    <text x="12" y="99">addi t1, t0, -128</text>
    <text x="12" y="139">add  s2, s2, t1</text>
    <text x="12" y="179">addi s0, s0, 4</text>
  </g>

  <!-- Row 1: lw t0, 0(s0) -->
  <g stroke="#000" stroke-width="1.2" text-anchor="middle" font-weight="bold">
    <rect x="168" y="38" width="54" height="30" rx="3" fill="#e6ebff"/><text x="195" y="58" stroke="none" fill="#000">IF</text>
    <rect x="233" y="38" width="54" height="30" rx="3" fill="#e6ebff"/><text x="260" y="58" stroke="none" fill="#000">ID</text>
    <rect x="298" y="38" width="54" height="30" rx="3" fill="#e6ebff"/><text x="325" y="58" stroke="none" fill="#000">EX</text>
    <rect x="360" y="38" width="60" height="30" rx="3" fill="#ffbfbf" stroke="#c0182b" stroke-width="1.8"/><text x="390" y="58" stroke="none" fill="#7f1d1d">MEM</text>
    <rect x="428" y="38" width="54" height="30" rx="3" fill="#e6ebff"/><text x="455" y="58" stroke="none" fill="#000">WB</text>
  </g>

  <!-- Row 2: addi t1, t0, -128 -->
  <g stroke="#000" stroke-width="1.2" text-anchor="middle" font-weight="bold">
    <rect x="233" y="78" width="54" height="30" rx="3" fill="#e6ebff"/><text x="260" y="98" stroke="none" fill="#000">IF</text>
    <rect x="298" y="78" width="54" height="30" rx="3" fill="#e6ebff"/><text x="325" y="98" stroke="none" fill="#000">ID</text>
    <rect x="363" y="78" width="54" height="30" rx="3" fill="#e6ebff"/><text x="390" y="98" stroke="none" fill="#000">EX</text>
    <rect x="428" y="78" width="54" height="30" rx="3" fill="#e6ebff"/><text x="455" y="98" stroke="none" fill="#000">MEM</text>
    <rect x="493" y="78" width="54" height="30" rx="3" fill="#e6ebff"/><text x="520" y="98" stroke="none" fill="#000">WB</text>
  </g>

  <!-- Row 3: add s2, s2, t1 -->
  <g stroke="#000" stroke-width="1.2" text-anchor="middle" font-weight="bold">
    <rect x="298" y="118" width="54" height="30" rx="3" fill="#e6ebff"/><text x="325" y="138" stroke="none" fill="#000">IF</text>
    <rect x="363" y="118" width="54" height="30" rx="3" fill="#e6ebff"/><text x="390" y="138" stroke="none" fill="#000">ID</text>
    <rect x="428" y="118" width="54" height="30" rx="3" fill="#e6ebff"/><text x="455" y="138" stroke="none" fill="#000">EX</text>
    <rect x="493" y="118" width="54" height="30" rx="3" fill="#e6ebff"/><text x="520" y="138" stroke="none" fill="#000">MEM</text>
    <rect x="558" y="118" width="54" height="30" rx="3" fill="#e6ebff"/><text x="585" y="138" stroke="none" fill="#000">WB</text>
  </g>

  <!-- Row 4: addi s0, s0, 4 -->
  <g stroke="#000" stroke-width="1.2" text-anchor="middle" font-weight="bold">
    <rect x="360" y="158" width="60" height="30" rx="3" fill="#ffbfbf" stroke="#c0182b" stroke-width="1.8"/><text x="390" y="178" stroke="none" fill="#7f1d1d">IF*</text>
    <rect x="428" y="158" width="54" height="30" rx="3" fill="#e5e7eb" stroke-dasharray="4,3"/><text x="455" y="178" stroke="none" fill="#c0182b">STALL</text>
    <rect x="493" y="158" width="54" height="30" rx="3" fill="#e6ebff"/><text x="520" y="178" stroke="none" fill="#000">IF</text>
    <rect x="558" y="158" width="54" height="30" rx="3" fill="#e6ebff"/><text x="585" y="178" stroke="none" fill="#000">ID</text>
  </g>

  <!-- Collision indicator in Cycle 4 -->
  <line x1="390" y1="71" x2="390" y2="155" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="386,75 390,68 394,75" fill="#dc2626"/>
  <polygon points="386,151 390,158 394,151" fill="#dc2626"/>
  <rect x="338" y="103" width="104" height="17" rx="3" fill="#fff5f5" stroke="#dc2626" stroke-width="1"/>
  <text x="390" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0182b">Port Collision</text>

  <!-- Footer Note -->
  <text x="330" y="216" text-anchor="middle" font-size="11.5" fill="#444">Single-port memory serves MEM (lw) in C4; IF* is blocked, injecting 1 STALL bubble before retrying IF.</text>
</svg>
