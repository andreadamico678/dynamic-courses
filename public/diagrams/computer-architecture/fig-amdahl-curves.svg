<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12.5">
  <rect width="720" height="385" fill="#fff"/>

  <!-- Plot background -->
  <rect x="75" y="40" width="490" height="282" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Horizontal Gridlines (S_tot = 2, 4, 6, 8, 10) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="75" y1="271.1" x2="565" y2="271.1"/>
    <line x1="75" y1="220.2" x2="565" y2="220.2"/>
    <line x1="75" y1="169.3" x2="565" y2="169.3"/>
    <line x1="75" y1="118.4" x2="565" y2="118.4"/>
    <line x1="75" y1="67.5" x2="565" y2="67.5"/>
  </g>

  <!-- Vertical Gridlines (S = 2, 4, 8, 16, 32, 64 on log2 scale) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="156.7" y1="40" x2="156.7" y2="322"/>
    <line x1="238.3" y1="40" x2="238.3" y2="322"/>
    <line x1="320.0" y1="40" x2="320.0" y2="322"/>
    <line x1="401.7" y1="40" x2="401.7" y2="322"/>
    <line x1="483.3" y1="40" x2="483.3" y2="322"/>
  </g>

  <!-- Horizontal Asymptote Ceilings S_max = 1 / (1 - F) -->
  <line x1="75" y1="67.5" x2="565" y2="67.5" stroke="#1f3fbf" stroke-width="1.4" stroke-dasharray="6,4"/>
  <line x1="75" y1="220.2" x2="565" y2="220.2" stroke="#15803d" stroke-width="1.4" stroke-dasharray="6,4"/>
  <line x1="75" y1="271.1" x2="565" y2="271.1" stroke="#a61c3c" stroke-width="1.4" stroke-dasharray="6,4"/>

  <!-- Axes -->
  <line x1="75" y1="322" x2="565" y2="322" stroke="#1e293b" stroke-width="1.7"/>
  <line x1="75" y1="322" x2="75" y2="38" stroke="#1e293b" stroke-width="1.7"/>

  <!-- Y-Axis Ticks and Labels -->
  <g text-anchor="end" font-size="11.5" fill="#334155">
    <line x1="70" y1="322.0" x2="75" y2="322.0" stroke="#1e293b" stroke-width="1.2"/>
    <text x="65" y="326">0</text>
    <line x1="70" y1="271.1" x2="75" y2="271.1" stroke="#1e293b" stroke-width="1.2"/>
    <text x="65" y="275">2×</text>
    <line x1="70" y1="220.2" x2="75" y2="220.2" stroke="#1e293b" stroke-width="1.2"/>
    <text x="65" y="224">4×</text>
    <line x1="70" y1="169.3" x2="75" y2="169.3" stroke="#1e293b" stroke-width="1.2"/>
    <text x="65" y="173">6×</text>
    <line x1="70" y1="118.4" x2="75" y2="118.4" stroke="#1e293b" stroke-width="1.2"/>
    <text x="65" y="122">8×</text>
    <line x1="70" y1="67.5" x2="75" y2="67.5" stroke="#1e293b" stroke-width="1.2"/>
    <text x="65" y="71">10×</text>
  </g>

  <!-- X-Axis Ticks and Labels -->
  <g text-anchor="middle" font-size="11.5" fill="#334155">
    <line x1="75.0" y1="322" x2="75.0" y2="327" stroke="#1e293b" stroke-width="1.2"/>
    <text x="75" y="342">1×</text>
    <line x1="156.7" y1="322" x2="156.7" y2="327" stroke="#1e293b" stroke-width="1.2"/>
    <text x="157" y="342">2×</text>
    <line x1="238.3" y1="322" x2="238.3" y2="327" stroke="#1e293b" stroke-width="1.2"/>
    <text x="238" y="342">4×</text>
    <line x1="320.0" y1="322" x2="320.0" y2="327" stroke="#1e293b" stroke-width="1.2"/>
    <text x="320" y="342">8×</text>
    <line x1="401.7" y1="322" x2="401.7" y2="327" stroke="#1e293b" stroke-width="1.2"/>
    <text x="402" y="342">16×</text>
    <line x1="483.3" y1="322" x2="483.3" y2="327" stroke="#1e293b" stroke-width="1.2"/>
    <text x="483" y="342">32×</text>
    <line x1="565.0" y1="322" x2="565.0" y2="327" stroke="#1e293b" stroke-width="1.2"/>
    <text x="565" y="342">64×</text>
  </g>

  <!-- Axis Titles -->
  <text x="320" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Local Enhancement Speedup <tspan font-style="italic">S</tspan> (log<tspan dy="3" font-size="9.5">2</tspan><tspan dy="-3"> scale)</tspan></text>
  <text x="24" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a" transform="rotate(-90 24 182)">Overall Speedup <tspan font-style="italic">S</tspan><tspan dy="3" font-size="9.5">tot</tspan></text>

  <!-- Formula Badge -->
  <rect x="92" y="54" width="206" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="195" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">
    <tspan font-style="italic">S</tspan><tspan dy="3" font-size="9.5">tot</tspan><tspan dy="-3"> = 1 / ((1 − </tspan><tspan font-style="italic">F</tspan><tspan>) + </tspan><tspan font-style="italic">F</tspan><tspan> / </tspan><tspan font-style="italic">S</tspan><tspan>)</tspan>
  </text>

  <!-- Exact Amdahl Speedup Curves -->
  <!-- F = 90% (blue) -->
  <polyline fill="none" stroke="#1f3fbf" stroke-width="2.4"
    points="75.0,296.5 122.8,285.6 156.7,275.7 204.4,258.4 238.3,243.7 286.1,220.2 320.0,202.2 367.8,176.6 401.7,159.1 449.4,136.9 483.3,123.3 531.1,107.6 565.0,98.8"/>

  <!-- F = 75% (green) -->
  <polyline fill="none" stroke="#15803d" stroke-width="2.4"
    points="75.0,296.5 122.8,288.1 156.7,281.3 204.4,271.1 238.3,263.8 286.1,254.1 320.0,247.9 367.8,240.5 401.7,236.3 449.4,231.5 483.3,228.9 531.1,226.2 565.0,224.8"/>

  <!-- F = 50% (crimson) -->
  <polyline fill="none" stroke="#a61c3c" stroke-width="2.4"
    points="75.0,296.5 122.8,291.5 156.7,288.1 204.4,283.8 238.3,281.3 286.1,278.4 320.0,276.7 367.8,275.0 401.7,274.1 449.4,273.1 483.3,272.6 531.1,272.1 565.0,271.9"/>

  <!-- Chapter 7 Example Highlight: F = 75%, S = 4 -> S_tot = 2.29x -->
  <circle cx="238.3" cy="263.8" r="4.5" fill="#15803d" stroke="#fff" stroke-width="1.5"/>
  <line x1="238.3" y1="259" x2="210" y2="210" stroke="#15803d" stroke-width="1.1" stroke-dasharray="3,2"/>
  <rect x="94" y="185" width="166" height="24" rx="4" fill="#ecfdf5" stroke="#15803d" stroke-width="1"/>
  <text x="177" y="201" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">Example: S = 4 ⇒ 2.29×</text>

  <!-- Inline Curve Labels -->
  <text x="488" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f3fbf">F = 90%</text>
  <text x="488" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">F = 75%</text>
  <text x="488" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#a61c3c">F = 50%</text>

  <!-- Right-Margin Asymptote Annotations -->
  <g font-size="11.5" font-weight="bold">
    <text x="574" y="64" fill="#1f3fbf">S<tspan dy="3" font-size="9">max</tspan><tspan dy="-3"> = 10×</tspan></text>
    <text x="574" y="79" font-size="10.5" font-weight="normal" fill="#475569">(F = 90% ceiling)</text>

    <text x="574" y="217" fill="#15803d">S<tspan dy="3" font-size="9">max</tspan><tspan dy="-3"> = 4×</tspan></text>
    <text x="574" y="232" font-size="10.5" font-weight="normal" fill="#475569">(F = 75% ceiling)</text>

    <text x="574" y="268" fill="#a61c3c">S<tspan dy="3" font-size="9">max</tspan><tspan dy="-3"> = 2×</tspan></text>
    <text x="574" y="283" font-size="10.5" font-weight="normal" fill="#475569">(F = 50% ceiling)</text>
  </g>
</svg>
