<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="275" viewBox="0 0 740 275" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#a61c3c"/>
    </marker>
  </defs>

  <rect width="740" height="275" fill="#fff"/>

  <!-- Top Banner: Iron Law Equation -->
  <rect x="145" y="14" width="450" height="48" rx="6" fill="#eef2ff" stroke="#1e3a8a" stroke-width="1.8"/>
  <text x="370" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">
    <tspan font-style="italic">T</tspan><tspan dy="4" font-size="11">exec</tspan><tspan dy="-4">  =  IC  ×  CPI  ×  </tspan><tspan font-style="italic">T</tspan><tspan dy="4" font-size="11">clk</tspan>
  </text>
  <text x="370" y="54" text-anchor="middle" font-size="11" fill="#475569">CPU Execution Time (Seconds / Program)</text>

  <!-- Branching Connectors -->
  <g fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr)">
    <path d="M 270,62 L 270,76 L 130,76 L 130,96"/>
    <line x1="370" y1="62" x2="370" y2="96"/>
    <path d="M 470,62 L 470,76 L 610,76 L 610,96"/>
  </g>

  <!-- Pillar 1: IC -->
  <rect x="26" y="99" width="208" height="114" rx="6" fill="#e6ebff" stroke="#1f3fbf" stroke-width="1.6"/>
  <text x="130" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">IC</text>
  <text x="130" y="143" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">Dynamic Instruction Count</text>
  <text x="130" y="162" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">Instructions / Program</text>
  <line x1="46" y1="173" x2="214" y2="173" stroke="#93c5fd" stroke-width="1"/>
  <text x="130" y="191" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Algorithm · Compiler (-O2)</text>
  <text x="130" y="205" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Instruction Set Architecture (ISA)</text>

  <!-- Pillar 2: CPI -->
  <rect x="266" y="99" width="208" height="114" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="370" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">CPI</text>
  <text x="370" y="143" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">Cycles Per Instruction</text>
  <text x="370" y="162" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">Clock Cycles / Instruction</text>
  <line x1="286" y1="173" x2="454" y2="173" stroke="#fcd34d" stroke-width="1"/>
  <text x="370" y="191" text-anchor="middle" font-size="11.5" fill="#92400e">Microarchitecture · Hazards</text>
  <text x="370" y="205" text-anchor="middle" font-size="11.5" fill="#92400e">Branch Prediction · Cache Misses</text>

  <!-- Pillar 3: T_clk -->
  <rect x="506" y="99" width="208" height="114" rx="6" fill="#d8f5d8" stroke="#15803d" stroke-width="1.6"/>
  <text x="610" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">
    <tspan font-style="italic">T</tspan><tspan dy="4" font-size="10.5">clk</tspan><tspan dy="-4"> = 1 / </tspan><tspan font-style="italic">f</tspan><tspan dy="4" font-size="10.5">clk</tspan>
  </text>
  <text x="610" y="143" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">Clock Cycle Period</text>
  <text x="610" y="162" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">Seconds / Clock Cycle</text>
  <line x1="526" y1="173" x2="694" y2="173" stroke="#86efac" stroke-width="1"/>
  <text x="610" y="191" text-anchor="middle" font-size="11.5" fill="#15803d">Critical Path Delay</text>
  <text x="610" y="205" text-anchor="middle" font-size="11.5" fill="#15803d">Pipeline Depth · Silicon Process</text>

  <!-- Multiplication symbols between pillars -->
  <text x="250" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#475569">×</text>
  <text x="490" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#475569">×</text>

  <!-- Trade-off Tension Connector between CPI and T_clk -->
  <path d="M 370,217 L 370,237 L 610,237 L 610,217" fill="none" stroke="#a61c3c" stroke-width="1.7" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <rect x="274" y="244" width="432" height="22" rx="4" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
  <text x="490" y="259" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a61c3c">Design Trade-Off: deeper pipelining shrinks T_clk but raises hazard stalls in CPI</text>
</svg>
