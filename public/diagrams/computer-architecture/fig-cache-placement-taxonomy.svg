<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="13">
  <rect width="760" height="380" fill="#fff"/>

  <!-- Top Source Block -->
  <rect x="240" y="14" width="280" height="48" rx="6" fill="#ffe6cc" stroke="#b85d00" stroke-width="1.6"/>
  <text x="380" y="34" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Main Memory Block <tspan font-style="italic">j</tspan> = 12</text>
  <text x="380" y="52" text-anchor="middle" font-size="11.5" fill="#555">8-Block Cache (<tspan font-style="italic">NB</tspan> = 8)</text>

  <!-- Branching Arrows to 3 Organizations -->
  <g stroke="#444" stroke-width="1.6" fill="none">
    <line x1="380" y1="62" x2="380" y2="78"/>
    <line x1="130" y1="78" x2="630" y2="78"/>
    <line x1="130" y1="78" x2="130" y2="92"/>
    <line x1="380" y1="78" x2="380" y2="92"/>
    <line x1="630" y1="78" x2="630" y2="92"/>
  </g>
  <polygon points="126,90 130,98 134,90" fill="#444"/>
  <polygon points="376,90 380,98 384,90" fill="#444"/>
  <polygon points="626,90 630,98 634,90" fill="#444"/>

  <!-- Panel 1: Direct-Mapped -->
  <rect x="18" y="98" width="224" height="268" rx="6" fill="#fcfcfd" stroke="#bbb" stroke-width="1.2"/>
  <text x="130" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">Direct-Mapped</text>
  <text x="130" y="135" text-anchor="middle" font-size="11.5" fill="#1f3fbf"><tspan font-style="italic">N</tspan> = 1, <tspan font-style="italic">NS</tspan> = 8 → 12 mod 8 = 4</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="36" y="146" width="188" height="21" fill="#f4f5f7" stroke="#666" stroke-width="1.1"/>
    <text x="130" y="161" fill="#555">Block 0</text>
    <rect x="36" y="169" width="188" height="21" fill="#f4f5f7" stroke="#666" stroke-width="1.1"/>
    <text x="130" y="184" fill="#555">Block 1</text>
    <rect x="36" y="192" width="188" height="21" fill="#f4f5f7" stroke="#666" stroke-width="1.1"/>
    <text x="130" y="207" fill="#555">Block 2</text>
    <rect x="36" y="215" width="188" height="21" fill="#f4f5f7" stroke="#666" stroke-width="1.1"/>
    <text x="130" y="230" fill="#555">Block 3</text>
    <rect x="36" y="238" width="188" height="21" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.8"/>
    <text x="130" y="253" font-weight="bold" fill="#145a25">Block 4  ←  j = 12</text>
    <rect x="36" y="261" width="188" height="21" fill="#f4f5f7" stroke="#666" stroke-width="1.1"/>
    <text x="130" y="276" fill="#555">Block 5</text>
    <rect x="36" y="284" width="188" height="21" fill="#f4f5f7" stroke="#666" stroke-width="1.1"/>
    <text x="130" y="299" fill="#555">Block 6</text>
    <rect x="36" y="307" width="188" height="21" fill="#f4f5f7" stroke="#666" stroke-width="1.1"/>
    <text x="130" y="322" fill="#555">Block 7</text>
  </g>
  <text x="130" y="352" text-anchor="middle" font-size="11" fill="#333">1 legal slot · 1 comparator</text>

  <!-- Panel 2: 2-Way Set-Associative -->
  <rect x="268" y="98" width="224" height="268" rx="6" fill="#fcfcfd" stroke="#bbb" stroke-width="1.2"/>
  <text x="380" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">2-Way Set-Associative</text>
  <text x="380" y="135" text-anchor="middle" font-size="11.5" fill="#1f3fbf"><tspan font-style="italic">N</tspan> = 2, <tspan font-style="italic">NS</tspan> = 4 → 12 mod 4 = 0</text>

  <text x="358" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Way 0</text>
  <text x="442" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Way 1</text>

  <!-- Set 0 (Highlighted) -->
  <rect x="315" y="161" width="170" height="42" rx="4" fill="#edf9ed" stroke="#1e7e34" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="295" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#145a25">Set 0</text>
  <rect x="320" y="166" width="76" height="32" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.6"/>
  <text x="358" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#145a25">j = 12?</text>
  <rect x="404" y="166" width="76" height="32" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.6"/>
  <text x="442" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#145a25">j = 12?</text>

  <!-- Sets 1..3 -->
  <g font-size="11" text-anchor="middle" fill="#666">
    <text x="295" y="228">Set 1</text>
    <rect x="320" y="208" width="76" height="32" fill="#f4f5f7" stroke="#777" stroke-width="1.1"/>
    <text x="358" y="228">—</text>
    <rect x="404" y="208" width="76" height="32" fill="#f4f5f7" stroke="#777" stroke-width="1.1"/>
    <text x="442" y="228">—</text>

    <text x="295" y="270">Set 2</text>
    <rect x="320" y="250" width="76" height="32" fill="#f4f5f7" stroke="#777" stroke-width="1.1"/>
    <text x="358" y="270">—</text>
    <rect x="404" y="250" width="76" height="32" fill="#f4f5f7" stroke="#777" stroke-width="1.1"/>
    <text x="442" y="270">—</text>

    <text x="295" y="312">Set 3</text>
    <rect x="320" y="292" width="76" height="32" fill="#f4f5f7" stroke="#777" stroke-width="1.1"/>
    <text x="358" y="312">—</text>
    <rect x="404" y="292" width="76" height="32" fill="#f4f5f7" stroke="#777" stroke-width="1.1"/>
    <text x="442" y="312">—</text>
  </g>
  <text x="380" y="352" text-anchor="middle" font-size="11" fill="#333">2 legal slots (Set 0) · 2 comparators</text>

  <!-- Panel 3: Fully Associative -->
  <rect x="518" y="98" width="224" height="268" rx="6" fill="#fcfcfd" stroke="#bbb" stroke-width="1.2"/>
  <text x="630" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">Fully Associative</text>
  <text x="630" y="135" text-anchor="middle" font-size="11.5" fill="#1f3fbf"><tspan font-style="italic">N</tspan> = 8, <tspan font-style="italic">NS</tspan> = 1 → Any slot</text>

  <rect x="530" y="142" width="200" height="190" rx="4" fill="#edf9ed" stroke="#1e7e34" stroke-width="1.3" stroke-dasharray="4,3"/>
  <g font-size="11.5" text-anchor="middle" fill="#145a25">
    <rect x="536" y="146" width="188" height="21" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.2"/>
    <text x="630" y="161">Slot 0  (j = 12 allowed)</text>
    <rect x="536" y="169" width="188" height="21" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.2"/>
    <text x="630" y="184">Slot 1  (j = 12 allowed)</text>
    <rect x="536" y="192" width="188" height="21" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.2"/>
    <text x="630" y="207">Slot 2  (j = 12 allowed)</text>
    <rect x="536" y="215" width="188" height="21" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.2"/>
    <text x="630" y="230">Slot 3  (j = 12 allowed)</text>
    <rect x="536" y="238" width="188" height="21" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.2"/>
    <text x="630" y="253">Slot 4  (j = 12 allowed)</text>
    <rect x="536" y="261" width="188" height="21" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.2"/>
    <text x="630" y="276">Slot 5  (j = 12 allowed)</text>
    <rect x="536" y="284" width="188" height="21" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.2"/>
    <text x="630" y="299">Slot 6  (j = 12 allowed)</text>
    <rect x="536" y="307" width="188" height="21" fill="#d8f5d8" stroke="#1e7e34" stroke-width="1.2"/>
    <text x="630" y="322">Slot 7  (j = 12 allowed)</text>
  </g>
  <text x="630" y="352" text-anchor="middle" font-size="11" fill="#333">8 legal slots · 8 comparators</text>
</svg>
