<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="290" viewBox="0 0 740 290" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',serif" font-size="12.5">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1f3fbf"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="740" height="290" fill="#fff"/>

  <!-- Reset arrow -->
  <line x1="36" y1="142" x2="91" y2="142" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="61" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Reset</text>

  <!-- Self-loops -->
  <g fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)">
    <!-- S0 self-loop: 00, 01, 10 -->
    <path d="M 111,115 C 94,74 156,74 139,115"/>
    <!-- S1 self-loop: 11 -->
    <path d="M 281,115 C 264,74 326,74 309,115"/>
  </g>
  <text x="125" y="75" text-anchor="middle" font-size="11.5" fill="#1e293b">00, 01, 10</text>
  <text x="295" y="75" text-anchor="middle" font-size="11.5" fill="#1e293b">11</text>

  <!-- Forward sequence transitions: 11 -> 10 -> 00 -->
  <g fill="none" stroke="#1f3fbf" stroke-width="1.8" marker-end="url(#arr-blue)">
    <line x1="156" y1="142" x2="261" y2="142"/>
    <line x1="326" y1="142" x2="431" y2="142"/>
  </g>
  <line x1="496" y1="142" x2="601" y2="142" fill="none" stroke="#15803d" stroke-width="2.1" marker-end="url(#arr-green)"/>
  <text x="210" y="133" text-anchor="middle" font-weight="bold" fill="#1f3fbf">11</text>
  <text x="380" y="133" text-anchor="middle" font-weight="bold" fill="#1f3fbf">10</text>
  <text x="550" y="133" text-anchor="middle" font-weight="bold" fill="#15803d">00</text>

  <!-- Upper overlap arcs to S1 -->
  <g fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)">
    <!-- S2 -> S1: 11 -->
    <path d="M 451,115 Q 380,72 313,115"/>
    <!-- S3 -> S1: 11 -->
    <path d="M 622,115 C 555,26 390,26 318,113"/>
  </g>
  <text x="382" y="88" text-anchor="middle" font-size="11.5" fill="#334155">11</text>
  <text x="470" y="38" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">11 (overlap)</text>

  <!-- Lower mismatch / reset arcs to S0 -->
  <g fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)">
    <!-- S1 -> S0: 00, 01 -->
    <path d="M 276,166 Q 210,204 145,167"/>
    <!-- S2 -> S0: 01, 10 -->
    <path d="M 452,170 Q 300,242 136,171"/>
    <!-- S3 -> S0: 00, 01, 10 -->
    <path d="M 625,171 C 520,282 230,282 126,174"/>
  </g>
  <text x="210" y="198" text-anchor="middle" font-size="11.5" fill="#334155">00, 01</text>
  <text x="310" y="226" text-anchor="middle" font-size="11.5" fill="#334155">01, 10</text>
  <text x="392" y="271" text-anchor="middle" font-size="11.5" fill="#334155">00, 01, 10</text>

  <!-- Moore State Nodes (S_k / u inside circles) -->
  <g text-anchor="middle">
    <!-- S0 / 0 -->
    <circle cx="125" cy="142" r="30" fill="#e6ebff" stroke="#1e3a8a" stroke-width="1.7"/>
    <line x1="103" y1="143" x2="147" y2="143" stroke="#1e3a8a" stroke-width="1"/>
    <text x="125" y="137" font-size="14" font-weight="bold" fill="#1e3a8a">S<tspan dy="3" font-size="10">0</tspan></text>
    <text x="125" y="160" font-size="13" font-weight="bold" fill="#1e3a8a">0</text>

    <!-- S1 / 0 -->
    <circle cx="295" cy="142" r="30" fill="#f8fafc" stroke="#1e293b" stroke-width="1.7"/>
    <line x1="273" y1="143" x2="317" y2="143" stroke="#64748b" stroke-width="1"/>
    <text x="295" y="137" font-size="14" font-weight="bold" fill="#0f172a">S<tspan dy="3" font-size="10">1</tspan></text>
    <text x="295" y="160" font-size="13" font-weight="bold" fill="#334155">0</text>

    <!-- S2 / 0 -->
    <circle cx="465" cy="142" r="30" fill="#f8fafc" stroke="#1e293b" stroke-width="1.7"/>
    <line x1="443" y1="143" x2="487" y2="143" stroke="#64748b" stroke-width="1"/>
    <text x="465" y="137" font-size="14" font-weight="bold" fill="#0f172a">S<tspan dy="3" font-size="10">2</tspan></text>
    <text x="465" y="160" font-size="13" font-weight="bold" fill="#334155">0</text>

    <!-- S3 / 1 (Recognition State) -->
    <circle cx="635" cy="142" r="30" fill="#d8f5d8" stroke="#15803d" stroke-width="2.2"/>
    <circle cx="635" cy="142" r="25.5" fill="none" stroke="#15803d" stroke-width="1"/>
    <line x1="616" y1="143" x2="654" y2="143" stroke="#15803d" stroke-width="1"/>
    <text x="635" y="137" font-size="14" font-weight="bold" fill="#15803d">S<tspan dy="3" font-size="10">3</tspan></text>
    <text x="635" y="160" font-size="13.5" font-weight="bold" fill="#15803d">1</text>
  </g>
</svg>
